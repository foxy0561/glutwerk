# Erzeugt updates.json: wann jedes Spiel zuletzt aktualisiert wurde und was neu ist.
# Die Startseite sortiert damit die Spiele und füllt das Update-Fenster.
# Läuft nach jedem Push, einmal am Tag (für Spiele in eigenen Repos wie Kiko Hüpft)
# und kann unter "Actions" per Hand gestartet werden.

name: Updates sammeln

on:
  push:
    branches: [main]
    paths-ignore: ["updates.json"]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: updates
  cancel-in-progress: true

jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: updates.json erzeugen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/updates.py
      - name: Speichern
        run: |
          if git diff --quiet -- updates.json; then echo "Nichts Neues."; exit 0; fi
          git config user.name "glutwerk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "updates.json aktualisiert [skip upd]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
