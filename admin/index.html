<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Glutwerk Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--bg2:#12151d;--card:#161a24;--line:#252b3a;--text:#e8ebf2;--muted:#8a93a8;--accent:#ff6a2b;--accent2:#ffb347;
  --bug:#ff4d5e;--idee:#ffd34d;--lob:#3ddc97;--neu:#4da3ff;--arbeit:#ffb347;--erledigt:#3ddc97}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:14px 28px;background:rgba(11,13,18,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:Rajdhani,sans-serif;font-weight:700;font-size:24px;letter-spacing:2px;text-transform:uppercase}
.logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.logo span{color:var(--accent)}
.tag{font-family:Rajdhani,sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;padding:4px 10px;border-radius:6px;background:rgba(255,106,43,.14);color:var(--accent2);border:1px solid rgba(255,106,43,.4)}
.sp{flex:1}
.hbtn{padding:8px 14px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.hbtn:hover{color:var(--text)}
main{max-width:1180px;margin:0 auto;padding:28px}
/* Anmelden */
.login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.login h1{font-family:Rajdhani,sans-serif;font-size:30px;text-transform:uppercase;margin-bottom:6px}
.login p{color:var(--muted);font-size:14px;margin-bottom:18px}
.inp{width:100%;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);outline:none;font-size:15px}
.inp:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#140800}
.btn[disabled]{opacity:.5;cursor:wait}
.err{color:#ff8a8a;font-size:13px;min-height:18px;margin:8px 0}
/* Übersicht */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:Rajdhani,sans-serif;font-size:32px;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.tab.on{color:var(--text);border-color:var(--accent);background:rgba(255,106,43,.1)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{color:var(--text);border-color:var(--accent);background:rgba(255,106,43,.1)}
.chip em{font-style:normal;font-size:11px;opacity:.7}
.sel{padding:8px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:13px}
.search{flex:1;min-width:180px;padding:8px 12px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:13px;outline:none}
.list{display:flex;flex-direction:column;gap:10px}
.rep{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--kc,var(--muted));border-radius:12px;padding:14px 16px}
.rep.done{opacity:.55}
.rep-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--muted)}
.pill{padding:3px 8px;border-radius:6px;font-weight:700;font-size:11px;letter-spacing:.5px;text-transform:uppercase}
.pill.game{background:rgba(255,255,255,.07);color:var(--text)}
.pill.k{background:color-mix(in srgb,var(--kc) 18%,transparent);color:var(--kc)}
.rep-text{font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.rep-meta{font-size:12px;color:var(--muted);margin-top:6px}
.rep-act{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sbtn{padding:6px 11px;border-radius:7px;font-size:12px;font-weight:700;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.sbtn:hover{color:var(--text)}
.sbtn.on.neu{color:var(--neu);border-color:var(--neu)}.sbtn.on.arbeit{color:var(--arbeit);border-color:var(--arbeit)}.sbtn.on.erledigt{color:var(--erledigt);border-color:var(--erledigt)}
.sbtn.del:hover{color:#ff8a8a;border-color:#ff4d5e}
.empty{text-align:center;color:var(--muted);padding:50px 10px;background:var(--card);border:1px dashed var(--line);border-radius:12px}
.pw{display:none;margin-bottom:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;gap:10px;flex-wrap:wrap;align-items:center}
.pw.open{display:flex}
.pw .inp{flex:1;min-width:200px}
@media (max-width:700px){
  header{padding:10px 14px;gap:10px}
  .logo{font-size:19px}
  main{padding:16px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .hbtn{padding:7px 9px;font-size:12px;white-space:nowrap}
  header{flex-wrap:wrap}
  .logo div:last-child{display:none}
  .tag{font-size:12px;padding:3px 7px}
}
</style>
</head>
<body>
<header>
  <a class="logo" href="../"><div class="logo-mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="#140800"><path d="M12 2c1 4 5 5.5 5 10.5A5 5 0 0 1 7 12.5c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg></div><div>Glut<span>werk</span></div></a>
  <span class="tag">ADMIN</span>
  <div class="sp"></div>
  <button class="hbtn" id="reload" title="Neu laden" hidden>↻</button>
  <button class="hbtn" id="pwBtn" hidden>Passwort</button>
  <button class="hbtn" id="logout" hidden>Abmelden</button>
</header>
<main id="main"></main>

<script>
const DB_URL = "https://fqidanxjcwdpjdtngimu.supabase.co";
const DB_KEY = "sb_publishable_BSiWVUEtRP2hE6RL77pI8Q_J57eHlaj";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let pass = null, data = null, tab = "bugs", fGame = "alle", fKind = "alle", fStatus = "offen", q = "";
try { pass = sessionStorage.getItem("glutwerk-admin"); } catch (e) {}

async function rpc(fn, body) {
  const r = await fetch(`${DB_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: DB_KEY, Authorization: "Bearer " + DB_KEY },
    body: JSON.stringify(body),
  });
  const t = await r.text();
  if (!r.ok) { let m = t; try { m = JSON.parse(t).message || t; } catch (e) {} throw new Error(m); }
  return t ? JSON.parse(t) : null;
}

/* ---- Meldungen verstehen: aus welchem Spiel, welche Art ---- */
function parse(b) {
  let text = b.report_text || "", game = "Riftward", kind = "Bug", device = "";
  let m = text.match(/^\[GLUTWERK\]\s*\[(\w+)\]\s*([^:]+):\s*/);
  if (m) { kind = m[1]; game = m[2].trim(); text = text.slice(m[0].length); }
  else if (/^\[SHARDFALL\]/.test(text)) {
    game = "Shardfall"; text = text.replace(/^\[SHARDFALL\]\s*/, "");
    const k = text.match(/^\[(Bug|Fehler|Idee|Vorschlag|Lob|Feedback)\]\s*/i);
    if (k) { kind = /idee|vorschlag/i.test(k[1]) ? "Idee" : /lob/i.test(k[1]) ? "Lob" : "Bug"; text = text.slice(k[0].length); }
  } else if (/^\[(\w[\w\s']*)\]/.test(text)) {
    const g = text.match(/^\[([^\]]+)\]\s*/); game = g[1].charAt(0) + g[1].slice(1).toLowerCase(); text = text.slice(g[0].length);
  }
  if (/^(idee|vorschlag)/i.test(text)) kind = "Idee";
  const d = text.match(/\n— (.+)$/);
  if (d) { device = d[1]; text = text.slice(0, d.index); }
  return { ...b, game, kind, text, device };
}
const KC = { Bug: "var(--bug)", Idee: "var(--idee)", Lob: "var(--lob)" };
const KNAME = { Bug: "🐞 Fehler", Idee: "💡 Idee", Lob: "❤️ Lob" };
const SNAME = { neu: "Neu", arbeit: "In Arbeit", erledigt: "Erledigt" };
const when = iso => { const d = new Date(iso); return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" }) + " " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }); };

/* ---- Anmelden ---- */
function showLogin(msg) {
  ["reload", "pwBtn", "logout"].forEach(id => $(id).hidden = true);
  $("main").innerHTML = `<form class="login" id="lf"><h1>Admin</h1><p>Fehler, Ideen und Lob aus allen Spielen.</p>
    <input class="inp" id="pw" type="password" placeholder="Passwort" autocomplete="current-password" autofocus>
    <div class="err" id="err">${esc(msg || "")}</div><button class="btn" id="go" style="width:100%">Anmelden</button></form>`;
  $("lf").onsubmit = async e => {
    e.preventDefault();
    const p = $("pw").value; if (!p) return;
    $("go").disabled = true; $("go").textContent = "Prüfe…"; $("err").textContent = "";
    try { data = await rpc("glutwerk_admin_reports", { p_pass: p }); pass = p; try { sessionStorage.setItem("glutwerk-admin", p); } catch (e) {} showDash(); }
    catch (err) { $("go").disabled = false; $("go").textContent = "Anmelden"; $("err").textContent = /passwort/i.test(err.message) ? "Falsches Passwort." : "Keine Verbindung: " + err.message; }
  };
}
async function load() {
  try { data = await rpc("glutwerk_admin_reports", { p_pass: pass }); showDash(); }
  catch (e) { pass = null; try { sessionStorage.removeItem("glutwerk-admin"); } catch (x) {} showLogin(/passwort/i.test(e.message) ? "Bitte neu anmelden." : e.message); }
}

/* ---- Übersicht ---- */
function showDash() {
  ["reload", "pwBtn", "logout"].forEach(id => $(id).hidden = false);
  const bugs = data.bugs.map(parse), lau = data.launcher || [];
  const open = bugs.filter(b => b.status !== "erledigt");
  const games = {}; bugs.forEach(b => games[b.game] = (games[b.game] || 0) + 1);
  const today = bugs.filter(b => Date.now() - new Date(b.created_at) < 864e5).length;
  let list = bugs.filter(b =>
    (fGame === "alle" || b.game === fGame) && (fKind === "alle" || b.kind === fKind) &&
    (fStatus === "alle" || (fStatus === "offen" ? b.status !== "erledigt" : b.status === fStatus)) &&
    (!q || (b.text + " " + b.player_name + " " + b.game).toLowerCase().includes(q.toLowerCase())));
  const chip = (cur, val, label, n, attr) => `<button class="chip${cur === val ? " on" : ""}" data-${attr}="${esc(val)}">${label}${n != null ? ` <em>${n}</em>` : ""}</button>`;
  $("main").innerHTML = `
    <div class="pw" id="pwBox"><input class="inp" id="pwNew" type="password" placeholder="Neues Passwort (mind. 10 Zeichen)" autocomplete="new-password"><button class="btn" id="pwSave">Speichern</button><span class="err" id="pwErr"></span></div>
    <div class="stats">
      <div class="stat"><b style="color:var(--neu)">${bugs.filter(b => b.status === "neu").length}</b><span>Neu</span></div>
      <div class="stat"><b style="color:var(--arbeit)">${bugs.filter(b => b.status === "arbeit").length}</b><span>In Arbeit</span></div>
      <div class="stat"><b style="color:var(--bug)">${open.filter(b => b.kind === "Bug").length}</b><span>Offene Fehler</span></div>
      <div class="stat"><b>${today}</b><span>Letzte 24 Stunden</span></div>
    </div>
    <div class="tabs">${chip(tab, "bugs", "Spiele", bugs.length, "tab").replace(/chip/, "tab")}${chip(tab, "launcher", "Minecraft-Launcher", lau.length, "tab").replace(/chip/, "tab")}</div>
    ${tab === "bugs" ? `
    <div class="filters">${chip(fGame, "alle", "Alle Spiele", bugs.length, "g")}${Object.keys(games).sort().map(g => chip(fGame, g, esc(g), games[g], "g")).join("")}</div>
    <div class="filters">
      ${chip(fKind, "alle", "Alles", null, "k")}${chip(fKind, "Bug", "🐞 Fehler", null, "k")}${chip(fKind, "Idee", "💡 Ideen", null, "k")}${chip(fKind, "Lob", "❤️ Lob", null, "k")}
      <select class="sel" id="fs">${[["offen", "Offen"], ["neu", "Nur neu"], ["arbeit", "In Arbeit"], ["erledigt", "Erledigt"], ["alle", "Alle"]].map(([v, l]) => `<option value="${v}"${fStatus === v ? " selected" : ""}>${l}</option>`).join("")}</select>
      <input class="search" id="q" placeholder="Suchen…" value="${esc(q)}">
    </div>
    <div class="list">${list.length ? list.map(b => `
      <div class="rep${b.status === "erledigt" ? " done" : ""}" style="--kc:${KC[b.kind] || "var(--muted)"}">
        <div class="rep-top"><span class="pill game">${esc(b.game)}</span><span class="pill k">${KNAME[b.kind] || esc(b.kind)}</span><span>${when(b.created_at)}</span><span>· ${esc(b.player_name || "Anonym")}</span></div>
        <div class="rep-text">${esc(b.text)}</div>
        ${b.device || b.game_version ? `<div class="rep-meta">${esc([b.device, b.game_version && !/^Glutwerk/.test(b.game_version) ? "Version " + b.game_version : ""].filter(Boolean).join(" · "))}</div>` : ""}
        <div class="rep-act">${["neu", "arbeit", "erledigt"].map(s => `<button class="sbtn ${s}${b.status === s ? " on" : ""}" data-st="${s}" data-id="${b.id}">${SNAME[s]}</button>`).join("")}<button class="sbtn del" data-del="${b.id}">Löschen</button></div>
      </div>`).join("") : `<div class="empty">${bugs.length ? "Nichts gefunden für diese Auswahl." : "Noch keine Meldungen. Sobald jemand im Spiel auf „Fehler melden“ klickt, taucht es hier auf."}</div>`}</div>` : `
    <div class="list">${lau.length ? lau.map(l => `
      <div class="rep" style="--kc:${/bug|fehler/i.test(l.kind) ? "var(--bug)" : "var(--idee)"}">
        <div class="rep-top"><span class="pill game">Minecraft-Launcher</span><span class="pill k">${esc(l.kind || "")}</span><span>${when(l.created_at)}</span>${l.status ? `<span>· ${esc(l.status)}</span>` : ""}</div>
        <div class="rep-text"><b>${esc(l.title || "")}</b>${l.description ? "\n" + esc(l.description) : ""}</div>
        <div class="rep-meta">${esc([l.launcher_version && "Version " + l.launcher_version, l.current_area, l.proposal_category].filter(Boolean).join(" · "))}</div>
      </div>`).join("") : `<div class="empty">Keine Meldungen aus dem Launcher.</div>`}</div>
    <p style="color:var(--muted);font-size:12px;margin-top:12px">Status ändern geht für Launcher-Meldungen weiter im Launcher selbst.</p>`}`;
  bind();
}
function bind() {
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; showDash(); });
  document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { fGame = b.dataset.g; showDash(); });
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { fKind = b.dataset.k; showDash(); });
  const fs = $("fs"); if (fs) fs.onchange = () => { fStatus = fs.value; showDash(); };
  const qi = $("q"); if (qi) qi.oninput = () => { q = qi.value; clearTimeout(qi._t); qi._t = setTimeout(() => { showDash(); const n = $("q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  document.querySelectorAll("[data-st]").forEach(b => b.onclick = async () => {
    const id = +b.dataset.id, st = b.dataset.st;
    const item = data.bugs.find(x => x.id === id); const old = item.status;
    item.status = st; showDash();
    try { await rpc("glutwerk_admin_status", { p_pass: pass, p_id: id, p_status: st }); }
    catch (e) { item.status = old; showDash(); alertMsg(e.message); }
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Wirklich löschen?"; return; }
    const id = +b.dataset.del;
    try { await rpc("glutwerk_admin_delete", { p_pass: pass, p_id: id }); data.bugs = data.bugs.filter(x => x.id !== id); showDash(); }
    catch (e) { alertMsg(e.message); }
  });
  const ps = $("pwSave"); if (ps) ps.onclick = async () => {
    const n = $("pwNew").value;
    if (n.length < 10) { $("pwErr").textContent = "Mindestens 10 Zeichen."; return; }
    try { await rpc("glutwerk_admin_passwort", { p_pass: pass, p_neu: n }); pass = n; try { sessionStorage.setItem("glutwerk-admin", n); } catch (e) {} $("pwErr").style.color = "var(--lob)"; $("pwErr").textContent = "Gespeichert!"; $("pwNew").value = ""; }
    catch (e) { $("pwErr").textContent = e.message; }
  };
}
function alertMsg(m) { const d = document.createElement("div"); d.className = "err"; d.style.cssText = "position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2a1014;padding:10px 16px;border-radius:10px;border:1px solid #ff4d5e;z-index:50"; d.textContent = "Fehler: " + m; document.body.appendChild(d); setTimeout(() => d.remove(), 4000); }

$("reload").onclick = () => { $("reload").textContent = "…"; load().then(() => $("reload").textContent = "↻"); };
$("logout").onclick = () => { pass = null; data = null; try { sessionStorage.removeItem("glutwerk-admin"); } catch (e) {} showLogin(); };
$("pwBtn").onclick = () => $("pwBox") && $("pwBox").classList.toggle("open");

if (pass) { $("main").innerHTML = `<div class="empty">Lädt…</div>`; load(); } else showLogin();
</script>
</body>
</html>
