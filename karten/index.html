<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glutwerk-Karten</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{
  --bg:#0b0d12;--bg2:#12151d;--card:#161a24;--card-hover:#1c2130;--line:#252b3a;
  --text:#e8ebf2;--muted:#8a93a8;--accent:#ff6a2b;--accent2:#ffb347;
  --common:#aab3c5;--rare:#4da3ff;--epic:#b26bff;--legendary:#ffc443;--mythic:#ff6ad5;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;
  background-image:
    radial-gradient(ellipse 70% 45% at 50% -8%, rgba(255,106,43,.2), transparent 70%),
    radial-gradient(ellipse 50% 40% at 90% 10%, rgba(178,107,255,.12), transparent 70%),
    linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
  background-size:auto,auto,40px 40px,40px 40px;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.rj{font-family:Rajdhani,sans-serif;font-weight:700;text-transform:uppercase}

/* ---------- Kopfleiste (wie auf der Spieleseite) ---------- */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;padding:14px 32px;
  background:rgba(11,13,18,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:Rajdhani,sans-serif;font-weight:700;font-size:26px;letter-spacing:2px;text-transform:uppercase}
.logo-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 0 20px rgba(255,106,43,.5)}
.logo-mark svg{width:20px;height:20px}
.logo span{color:var(--accent)}
.nav{display:flex;gap:4px}
.nav a{padding:8px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted);transition:color .15s,background .15s;white-space:nowrap}
.nav a:hover{color:var(--text)}
.nav a.active{color:var(--text);background:var(--card);box-shadow:inset 0 -2px 0 var(--accent)}
.glut-chip{margin-left:auto;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;
  background:linear-gradient(135deg,rgba(255,106,43,.16),rgba(255,179,71,.08));border:1px solid rgba(255,106,43,.45);
  font-family:Rajdhani,sans-serif;font-weight:700;font-size:19px;color:var(--accent2)}
.glut-chip svg{width:17px;height:17px;color:var(--accent);filter:drop-shadow(0 0 6px rgba(255,106,43,.8))}
.glut-chip.bump{animation:bump .5s}
.glut-chip.minus{animation:minus .5s}
@keyframes bump{30%{transform:scale(1.18);box-shadow:0 0 24px rgba(255,106,43,.8)}}
@keyframes minus{30%{transform:scale(.9);filter:brightness(.6)}}

main{max-width:1240px;margin:0 auto;padding:32px}
h2.sec{font-family:Rajdhani,sans-serif;font-size:28px;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2.sec small{font-size:15px;color:var(--muted);letter-spacing:0}

/* ---------- Kopfbereich ---------- */
.top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:stretch;margin-bottom:44px}
.intro{position:relative;border-radius:18px;border:1px solid var(--line);padding:30px 255px 30px 30px;overflow:hidden;
  background:radial-gradient(circle at 85% 30%,rgba(255,106,43,.25),transparent 55%),linear-gradient(135deg,#1a1210,#12151d 60%)}
.intro h1{font-family:Rajdhani,sans-serif;font-size:clamp(36px,5.5vw,54px);line-height:.95;text-transform:uppercase;margin:8px 0 10px}
.intro h1 span{color:var(--accent);text-shadow:0 0 30px rgba(255,106,43,.6)}
.intro .label{font-family:Rajdhani,sans-serif;font-weight:700;letter-spacing:2px;font-size:13px;color:var(--accent);text-transform:uppercase}
.intro p{color:#c3c9d6;line-height:1.5;max-width:440px}
.progress{margin-top:22px;max-width:420px}
.progress-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.progress-row b{color:var(--text);font-family:Rajdhani,sans-serif;font-size:18px}
.bar{height:10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 12px rgba(255,106,43,.7);transition:width .6s}
.intro-fan{position:absolute;right:-10px;bottom:-30px;width:250px;height:230px;pointer-events:none}
.intro-fan .tcard{position:absolute;width:118px;bottom:0;right:60px;transform-origin:50% 120%}
.intro-fan .tcard:nth-child(1){transform:rotate(-16deg) translateX(-40px)}
.intro-fan .tcard:nth-child(2){transform:rotate(0) translateY(-14px)}
.intro-fan .tcard:nth-child(3){transform:rotate(16deg) translateX(40px)}
.earn{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.earn span{font-size:12px;font-weight:600;padding:6px 10px;border-radius:7px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:#d5dae5}
.earn b{color:var(--accent2)}

/* ---------- Shop ---------- */
.shop{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.offer{position:relative;border-radius:18px;border:1px solid var(--line);background:var(--card);padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;overflow:hidden}
.offer::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,var(--og),transparent 60%);opacity:.35;pointer-events:none}
.offer .mini-pack{width:min(120px,60%);margin:4px 0 2px;animation:float 4s ease-in-out infinite}
.offer:nth-child(2) .mini-pack{animation-delay:-2s}
@keyframes float{50%{transform:translateY(-8px) rotate(1.5deg)}}
.offer h3{font-family:Rajdhani,sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:1px}
.offer .odds{font-size:12px;color:var(--muted);line-height:1.45;min-height:34px}
.buy{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 14px;border-radius:10px;
  font-family:Rajdhani,sans-serif;font-weight:700;font-size:19px;letter-spacing:1px;text-transform:uppercase;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#140800;box-shadow:0 4px 20px rgba(255,106,43,.35);transition:transform .15s,box-shadow .15s}
.buy:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,106,43,.6)}
.buy svg{width:17px;height:17px}
.buy[disabled]{background:var(--bg2);color:var(--muted);box-shadow:none;transform:none;cursor:not-allowed;border:1px solid var(--line);font-size:15px}
.offer.inferno .buy:not([disabled]){background:linear-gradient(135deg,#ff2d55,#ff9a3c);box-shadow:0 4px 24px rgba(255,45,85,.45)}

/* ---------- Sammlung ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--text)}
.chip.on{color:var(--text);border-color:var(--accent);background:rgba(255,106,43,.1)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip em{font-style:normal;font-size:11px;color:var(--muted);font-weight:700}
.chip.done em{color:#3ddc97}
.chip-right{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}
.grid .slotc{position:relative;cursor:pointer;container-type:inline-size}
.count{position:absolute;top:-8px;right:-8px;z-index:5;min-width:26px;height:26px;padding:0 7px;border-radius:13px;display:grid;place-items:center;
  font-family:Rajdhani,sans-serif;font-weight:700;font-size:15px;background:var(--accent);color:#140800;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.count.foilc{background:linear-gradient(135deg,#7df9ff,#ff7ae0,#ffe66d);top:22px}

/* =========================================================
   KARTE
   ========================================================= */
.tcard{--rc:var(--common);--rx:0deg;--ry:0deg;--mx:50%;--my:50%;
  position:relative;width:100%;aspect-ratio:63/88;border-radius:6.5% / 4.65%;container-type:inline-size;
  transform-style:preserve-3d;transition:transform .25s ease-out,box-shadow .25s;
  transform:perspective(700px) rotateX(var(--rx)) rotateY(var(--ry));
  box-shadow:0 8px 24px rgba(0,0,0,.55)}
.tcard.r-rare{--rc:var(--rare)}.tcard.r-epic{--rc:var(--epic)}.tcard.r-legendary{--rc:var(--legendary)}.tcard.r-mythic{--rc:var(--mythic)}
.tcard .frame{position:absolute;inset:0;border-radius:inherit;padding:2.4cqw;
  background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 85%,#fff),color-mix(in srgb,var(--rc) 55%,#000) 45%,color-mix(in srgb,var(--rc) 90%,#fff) 70%,color-mix(in srgb,var(--rc) 50%,#000))}
.tcard.r-legendary .frame{background:conic-gradient(from var(--ang),#fff3c4,#ffb800,#7a4a00,#ffd56b,#fff3c4,#c27b00,#ffe9a0,#fff3c4);animation:spin 5s linear infinite}
.tcard.r-mythic .frame{background:conic-gradient(from var(--ang),#ff6ad5,#ffe66d,#7df9ff,#9d7bff,#ff6ad5,#7dffb0,#ff9a5c,#ff6ad5);animation:spin 3.5s linear infinite}
@keyframes spin{to{--ang:360deg}}
.tcard .inner{position:relative;height:100%;border-radius:4.6cqw;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1b1f2b,#0f1219)}
.tc-head{display:flex;align-items:center;justify-content:space-between;gap:3cqw;padding:3.6cqw 4.5cqw 2.6cqw}
.tc-name{font-family:Rajdhani,sans-serif;font-weight:700;font-size:9.6cqw;line-height:1.2;padding-top:.6cqw;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2cqw}
.tc-pow{flex-shrink:0;width:13cqw;height:13cqw;border-radius:50%;display:grid;place-items:center;font-family:Rajdhani,sans-serif;font-weight:700;font-size:8.5cqw;color:#140800;
  background:radial-gradient(circle at 35% 30%,#fff,var(--rc) 55%,color-mix(in srgb,var(--rc) 50%,#000));box-shadow:0 0 3cqw color-mix(in srgb,var(--rc) 70%,transparent)}
.tc-art{position:relative;margin:0 3.6cqw;aspect-ratio:4/3;border-radius:2.6cqw;overflow:hidden;
  box-shadow:inset 0 0 0 .6cqw rgba(255,255,255,.12),0 1cqw 3cqw rgba(0,0,0,.5)}
.tc-art svg{position:absolute;inset:0;width:100%;height:100%}
.tc-type{display:flex;justify-content:space-between;gap:2cqw;align-items:center;margin:2.6cqw 3.6cqw 0;padding:1.6cqw 3cqw;border-radius:1.8cqw;
  background:rgba(255,255,255,.06);font-size:5.4cqw;font-weight:700;letter-spacing:.3cqw;text-transform:uppercase;color:#cfd5e2}
.tc-type b{color:var(--rc)}
.tc-text{flex:1;display:flex;align-items:center;padding:2cqw 5cqw;font-size:6.2cqw;line-height:1.3;color:#b9c0cf;font-style:italic}
.tc-foot{display:flex;justify-content:space-between;align-items:center;padding:0 4.5cqw 3.4cqw;font-size:5cqw;color:#6f788c;font-weight:700;letter-spacing:.3cqw}
.tc-gem{width:5cqw;height:5cqw;transform:rotate(45deg);background:var(--rc);box-shadow:0 0 2.5cqw var(--rc)}
/* Mythisch: Bild über die ganze Karte */
.tcard.r-mythic .tc-art{position:absolute;inset:0;margin:0;aspect-ratio:auto;border-radius:0;box-shadow:none}
.tcard.r-mythic .tc-art img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.tcard.r-mythic .tc-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,6,20,.55) 0%,transparent 22%,transparent 52%,rgba(10,6,20,.92) 78%)}
.tcard.r-mythic .tc-head,.tcard.r-mythic .tc-type,.tcard.r-mythic .tc-text,.tcard.r-mythic .tc-foot{position:relative;z-index:2}
.tcard.r-mythic .tc-head{text-shadow:0 0 3cqw #000}
.tcard.r-mythic .tc-spacer{flex:1}
.tcard.r-mythic .tc-text{flex:0 0 auto;color:#f0e6ff;padding-bottom:3cqw}
.tcard.r-mythic .tc-type{background:rgba(0,0,0,.45);backdrop-filter:blur(2px)}
/* Glanz (Holo) */
.tc-holo,.tc-glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:4}
.tcard.foil .tc-holo{mix-blend-mode:color-dodge;opacity:.5;
  background:
    repeating-linear-gradient(115deg,#ff0080 0%,#ffd000 6%,#00ff9d 12%,#00b3ff 18%,#b300ff 24%,#ff0080 30%),
    repeating-linear-gradient(25deg,rgba(255,255,255,.0) 0 6px,rgba(255,255,255,.25) 6px 7px);
  background-size:400% 400%,100% 100%;background-position:var(--mx) var(--my),0 0;filter:saturate(1.3)}
.tcard.foil:not(.tilting) .tc-holo{animation:holo 6s ease-in-out infinite alternate}
@keyframes holo{from{background-position:0% 0%,0 0}to{background-position:100% 100%,0 0}}
.tc-glare{background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.4),transparent 45%);mix-blend-mode:overlay;opacity:0;transition:opacity .25s}
.tcard.tilting .tc-glare{opacity:1}
.foil-tag{position:absolute;z-index:5;left:4.5cqw;top:17cqw;font-size:4.6cqw;font-weight:800;letter-spacing:.4cqw;padding:.8cqw 2.4cqw;border-radius:2cqw;color:#1a0b2e;
  background:linear-gradient(90deg,#7df9ff,#ff7ae0,#ffe66d);box-shadow:0 0 3cqw rgba(255,122,224,.7)}
/* noch nicht gefunden */
.tcard.locked{box-shadow:none}
.tcard.locked .frame{background:#252b3a;animation:none}
.tcard.locked .inner{background:repeating-linear-gradient(135deg,#141822 0 10px,#11141c 10px 20px);align-items:center;justify-content:center;gap:3cqw;text-align:center}
.tcard.locked .q{font-family:Rajdhani,sans-serif;font-weight:700;font-size:34cqw;line-height:1;color:#252b3a}
.tcard.locked .lk-set{font-size:6.2cqw;font-weight:700;color:#5d6578;text-transform:uppercase;letter-spacing:.4cqw;padding:0 6cqw}
.tcard.locked .lk-rar{display:flex;align-items:center;gap:2cqw;font-size:5.4cqw;font-weight:700;color:#5d6578;text-transform:uppercase}
.tcard.locked .lk-no{position:absolute;bottom:4cqw;font-size:5cqw;color:#3b4253;font-weight:700}

/* Rückseite */
.cback{position:absolute;inset:0;border-radius:6.5% / 4.65%;overflow:hidden;container-type:inline-size;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,106,43,.35),transparent 45%),
    repeating-conic-gradient(from 0deg at 50% 50%,#1b0f0a 0deg 10deg,#140a07 10deg 20deg);
  border:2.4cqw solid #3a1d10;box-shadow:inset 0 0 0 1cqw #7a3a14,0 8px 24px rgba(0,0,0,.55);display:grid;place-items:center}
.cback::before{content:"";position:absolute;inset:6cqw;border-radius:4cqw;border:.8cqw solid rgba(255,179,71,.35)}
.cback svg{width:38cqw;height:38cqw;color:var(--accent);filter:drop-shadow(0 0 5cqw rgba(255,106,43,.9))}
.cback .bt{position:absolute;bottom:11cqw;font-family:Rajdhani,sans-serif;font-weight:700;letter-spacing:1.5cqw;font-size:7cqw;color:#ffb347;text-transform:uppercase}

/* =========================================================
   PACK
   ========================================================= */
.pack{--p1:#ff6a2b;--p2:#8a1c00;--p3:#ffd27a;position:relative;aspect-ratio:5/8;border-radius:5%/3%;container-type:inline-size;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.pack.inferno{--p1:#ff2d55;--p2:#3a0016;--p3:#ffb36b}
.pack .pk-top,.pack .pk-body{position:absolute;left:0;right:0;overflow:hidden;
  background:
    linear-gradient(115deg,transparent 20%,rgba(255,255,255,.35) 30%,transparent 40%) ,
    radial-gradient(circle at 50% 42%,var(--p3),transparent 38%),
    linear-gradient(160deg,var(--p1),var(--p2) 70%);
  background-size:300% 100%,100% 100%,100% 100%;animation:sheen 4.5s linear infinite}
@keyframes sheen{from{background-position:120% 0,0 0,0 0}to{background-position:-120% 0,0 0,0 0}}
.pack .pk-top{top:0;height:15%;border-radius:5cqw 5cqw 0 0;
  -webkit-mask:linear-gradient(#000,#000) top/100% 88% no-repeat,radial-gradient(circle 2.2cqw at 50% 100%,transparent 98%,#000) bottom/6cqw 12% repeat-x;
          mask:linear-gradient(#000,#000) top/100% 88% no-repeat,radial-gradient(circle 2.2cqw at 50% 100%,transparent 98%,#000) bottom/6cqw 12% repeat-x;
  transition:transform .7s cubic-bezier(.3,1.4,.5,1),opacity .7s}
.pack .pk-top::after{content:"";position:absolute;left:0;right:0;top:20%;height:30%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 2cqw,rgba(255,255,255,.12) 2cqw 4cqw)}
.pack .pk-body{top:14.5%;bottom:0;border-radius:0 0 5cqw 5cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;padding-bottom:6cqw;
  -webkit-mask:linear-gradient(#000,#000) bottom/100% 96% no-repeat,radial-gradient(circle 2.2cqw at 50% 0,transparent 98%,#000) top/6cqw 4% repeat-x;
          mask:linear-gradient(#000,#000) bottom/100% 96% no-repeat,radial-gradient(circle 2.2cqw at 50% 0,transparent 98%,#000) top/6cqw 4% repeat-x}
.pack .pk-body::after{content:"";position:absolute;left:0;right:0;bottom:3%;height:5%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 2cqw,rgba(255,255,255,.12) 2cqw 4cqw)}
.pk-emblem{width:42cqw;height:42cqw;border-radius:50%;display:grid;place-items:center;margin-top:-4cqw;
  background:radial-gradient(circle,rgba(255,255,255,.35),rgba(0,0,0,.15) 70%);box-shadow:inset 0 0 0 1.2cqw rgba(255,255,255,.35),0 0 10cqw rgba(255,210,122,.6)}
.pk-emblem svg{width:26cqw;height:26cqw;color:#fff;filter:drop-shadow(0 0 4cqw #fff)}
.pk-name{font-family:Rajdhani,sans-serif;font-weight:700;font-size:14cqw;line-height:.9;text-transform:uppercase;letter-spacing:.8cqw;color:#fff;text-shadow:0 .8cqw 0 rgba(0,0,0,.35),0 0 5cqw rgba(255,255,255,.5);text-align:center}
.pk-sub{font-size:5.2cqw;font-weight:700;letter-spacing:.8cqw;text-transform:uppercase;color:rgba(255,255,255,.85)}
.pk-brand{position:absolute;top:6cqw;font-family:Rajdhani,sans-serif;font-weight:700;letter-spacing:1.6cqw;font-size:6cqw;color:rgba(255,255,255,.9);text-transform:uppercase}

/* =========================================================
   ÖFFNEN
   ========================================================= */
.opening{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,#2a1208 0%,#0a0605 60%,#000 100%)}
.opening.open{display:flex}
.opening.mythic-bg{background:radial-gradient(circle at 50% 45%,#2b0b33 0%,#0b0412 60%,#000 100%)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.op-hint{position:relative;z-index:2;font-family:Rajdhani,sans-serif;font-weight:700;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:#ffcf9c;text-align:center;min-height:26px;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.5}}
.op-pack{position:relative;z-index:2;width:min(250px,58vw);cursor:pointer;transition:transform .4s}
.op-pack .pack{animation:packIn .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes packIn{from{transform:translateY(60vh) rotate(-12deg) scale(.6)}}
.op-pack:hover .pack{transform:scale(1.03)}
.op-pack.shake .pack{animation:shake .5s linear}
.op-pack.shake2 .pack{animation:shake 0.4s linear infinite}
@keyframes shake{10%,90%{transform:translateX(-2px) rotate(-1deg)}20%,80%{transform:translateX(4px) rotate(1.5deg)}30%,50%,70%{transform:translateX(-6px) rotate(-2deg)}40%,60%{transform:translateX(6px) rotate(2deg)}}
.op-pack.torn .pk-top{transform:translate(70%,-140%) rotate(38deg);opacity:0}
.op-pack.gone .pack{transition:transform .6s ease-in,opacity .6s;transform:translateY(80vh) rotate(8deg);opacity:0}
.op-glow{position:absolute;z-index:1;width:min(560px,130vw);aspect-ratio:1;border-radius:50%;
  background:conic-gradient(from var(--ang),transparent 0 8deg,rgba(255,170,90,.18) 8deg 16deg,transparent 16deg 30deg,rgba(255,170,90,.14) 30deg 36deg,transparent 36deg 60deg);
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%);animation:spin 18s linear infinite;pointer-events:none}

.reveal{position:relative;z-index:2;display:none;flex-wrap:wrap;justify-content:center;gap:clamp(10px,2vw,22px);max-width:1100px;width:100%}
.reveal.on{display:flex}
.rslot{--rc:var(--common);container-type:inline-size;position:relative;width:clamp(96px,17vw,190px);aspect-ratio:63/88;perspective:900px;cursor:pointer;
  opacity:0;transform:translateY(40vh) scale(.5) rotate(var(--rot,0deg));transition:opacity .45s,transform .65s cubic-bezier(.2,1.3,.4,1)}
.rslot.in{opacity:1;transform:none}
.rslot.r-rare{--rc:var(--rare)}.rslot.r-epic{--rc:var(--epic)}.rslot.r-legendary{--rc:var(--legendary)}.rslot.r-mythic{--rc:var(--mythic)}
.flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.25,.5,1)}
.rslot.flipped .flipper{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
/* Vorahnung: die Rückseite leuchtet in der Seltenheitsfarbe */
.rslot:not(.flipped).r-rare .cback{box-shadow:inset 0 0 0 1cqw #7a3a14,0 0 22px 2px var(--rc)}
.rslot:not(.flipped).r-epic .cback{box-shadow:inset 0 0 0 1cqw #7a3a14,0 0 30px 6px var(--rc);animation:pulseGlow 1.2s ease-in-out infinite}
.rslot:not(.flipped).r-legendary .cback,.rslot:not(.flipped).r-mythic .cback{box-shadow:inset 0 0 0 1cqw #7a3a14,0 0 40px 10px var(--rc);animation:pulseGlow .8s ease-in-out infinite}
.rslot:not(.flipped).r-legendary .flipper,.rslot:not(.flipped).r-mythic .flipper{animation:tremble .25s linear infinite}
@keyframes pulseGlow{50%{filter:brightness(1.35)}}
@keyframes tremble{25%{transform:translate(1px,-1px) rotate(.6deg)}75%{transform:translate(-1px,1px) rotate(-.6deg)}}
.rays{position:absolute;left:50%;top:50%;width:280%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;opacity:0;transition:opacity .5s;
  background:conic-gradient(from var(--ang),transparent 0 10deg,var(--rc) 10deg 14deg,transparent 14deg 40deg,var(--rc) 40deg 43deg,transparent 43deg 70deg,var(--rc) 70deg 75deg,transparent 75deg 110deg,var(--rc) 110deg 113deg,transparent 113deg 150deg,var(--rc) 150deg 155deg,transparent 155deg 200deg,var(--rc) 200deg 204deg,transparent 204deg 250deg,var(--rc) 250deg 254deg,transparent 254deg 300deg,var(--rc) 300deg 305deg,transparent 305deg);
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 62%);mask:radial-gradient(circle,#000 10%,transparent 62%);animation:spin 9s linear infinite}
.rslot.flipped.r-legendary .rays,.rslot.flipped.r-mythic .rays{opacity:.55}
.rslot.flipped.r-epic .rays{opacity:.25}
.rtag{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border-radius:6px;opacity:0;transition:opacity .3s .5s}
.rslot.flipped .rtag{opacity:1}
.rtag.new{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#140800;box-shadow:0 0 14px rgba(255,106,43,.7)}
.rtag.dup{background:rgba(255,255,255,.08);color:#ffcf9c;border:1px solid rgba(255,179,71,.35)}
.big-word{position:absolute;z-index:5;left:50%;top:14%;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;
  font-family:Rajdhani,sans-serif;font-weight:700;font-size:clamp(40px,9vw,92px);letter-spacing:4px;text-transform:uppercase;white-space:nowrap}
.big-word.go{animation:bigWord 1.9s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes bigWord{15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.opening.quake{animation:quake .5s linear}
@keyframes quake{10%,90%{transform:translate(-3px,2px)}20%,80%{transform:translate(5px,-3px)}30%,50%,70%{transform:translate(-8px,4px)}40%,60%{transform:translate(8px,-4px)}}
.op-actions{position:relative;z-index:2;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:28px;min-height:48px}
.op-btn{padding:11px 20px;border-radius:10px;font-family:Rajdhani,sans-serif;font-weight:700;font-size:17px;letter-spacing:1px;text-transform:uppercase;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff}
.op-btn:hover{background:rgba(255,255,255,.14)}
.op-btn.hot{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#140800;border:none;box-shadow:0 4px 20px rgba(255,106,43,.45)}
.op-btn[disabled]{opacity:.4;cursor:not-allowed}
.op-summary{position:relative;z-index:2;margin-top:18px;text-align:center;font-size:14px;color:#ffcf9c;min-height:20px;display:flex;flex-direction:column;gap:4px}
.op-summary b{color:#fff}
.mute{position:absolute;top:14px;right:14px;z-index:6;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);display:grid;place-items:center;font-size:18px}
.skip{position:absolute;top:14px;left:14px;z-index:6}

/* ---------- Karte groß ---------- */
.zoom{position:fixed;inset:0;z-index:110;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;background:rgba(3,4,8,.88);backdrop-filter:blur(6px)}
.zoom.open{display:flex}
.zoom .zc{width:min(340px,78vw,calc((100vh - 170px) * .716))}
.zoom-info{text-align:center;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.zoom-info b{color:var(--text)}
.zoom-x{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);font-size:22px;line-height:1}

.toasts{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;max-width:340px;background:linear-gradient(135deg,#2a1408,#1a0e08);border:1px solid rgba(255,106,43,.55);box-shadow:0 10px 30px rgba(0,0,0,.55);font-size:13px;animation:tin .45s cubic-bezier(.2,1.4,.4,1)}
.toast .amt{font-family:Rajdhani,sans-serif;font-weight:700;font-size:24px;color:var(--accent2)}
.toast b{display:block;font-size:14px}
@keyframes tin{from{opacity:0;transform:translateY(20px) scale(.9)}}

footer{text-align:center;color:var(--muted);font-size:13px;padding:40px 16px;border-top:1px solid var(--line);margin-top:60px}

@media (max-width:900px){
  .top{grid-template-columns:1fr}
  .intro-fan{display:none}
  .intro{padding:30px}
}
@media (max-width:640px){
  header{gap:8px;padding:10px 12px;flex-wrap:wrap;row-gap:8px}
  .logo{font-size:20px}
  .logo-mark{width:30px;height:30px}
  #siteName{display:none}
  .nav{order:10;width:100%;justify-content:space-between;gap:2px}
  .nav a{flex:1;text-align:center;font-size:13px;padding:7px 6px}
  main{padding:20px 16px}
  .intro{padding:22px}
  .shop{gap:10px}
  .offer{padding:14px 10px 12px}
  .offer .odds{font-size:11px}
  .buy{font-size:16px;padding:11px 8px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .count{min-width:22px;height:22px;font-size:13px;top:-6px;right:-6px}
  .count.foilc{top:18px}
  .rslot{width:calc((100vw - 64px) / 3)}
  .reveal{gap:44px 10px}
  .rtag{font-size:10px;bottom:-24px;padding:3px 6px}
  .op-actions{margin-top:24px}
  .toasts{left:12px;right:12px;align-items:stretch}
  .toast{max-width:none}
  .chip-right{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  .tcard.r-legendary .frame,.tcard.r-mythic .frame,.rays,.op-glow,.pack .pk-top,.pack .pk-body{animation:none!important}
}

/* =========================================================
   PACKS ZIEHEN
   ========================================================= */
function rollRarity(odds, min) {
  const keys = RORDER.filter(r => RORDER.indexOf(r) >= RORDER.indexOf(min || "common"));
  const sum = keys.reduce((a, k) => a + odds[k], 0);
  let x = Math.random() * sum;
  for (const k of keys) { x -= odds[k]; if (x <= 0) return k; }
  return keys[0];
}
function pickCard(r) {
  const list = CARDS.filter(c => c.r === r);
  const sum = list.reduce((a, c) => a + (c.w || 1), 0);
  let x = Math.random() * sum;
  for (const c of list) { x -= (c.w || 1); if (x <= 0) return c; }
  return list[0];
}
function buyPack(key) {
  const p = PACKS[key];
  if (glutGet() < p.price) return;
  glutSet(glutGet() - p.price, "minus");
  const pulls = [];
  for (let i = 0; i < p.size; i++) {
    const r = rollRarity(p.odds, i === p.size - 1 ? p.guarantee : null);
    pulls.push({ c: pickCard(r), foil: Math.random() < p.foil });
  }
  // in die Sammlung legen (sofort speichern, damit nichts verloren geht)
  let refund = 0;
  pulls.forEach(x => {
    const o = coll.c[x.c.id] || { n: 0, f: 0 };
    x.isNew = o.n + o.f === 0;
    x.newFoil = x.foil && !o.f && !x.isNew;
    x.dup = !x.isNew && !x.newFoil;
    x.refund = x.dup ? RARITY[x.c.r].refund * (x.foil ? 2 : 1) : 0;
    refund += x.refund;
    if (x.foil) o.f++; else o.n++;
    coll.c[x.c.id] = o;
  });
  const sets = [];
  Object.keys(SETS).forEach(k => {
    if (coll.sets[k]) return;
    if (CARDS.filter(c => c.set === k).every(c => owned(c.id))) { coll.sets[k] = true; sets.push(k); }
  });
  coll.packs++;
  saveColl();
  const bonus = refund + sets.length * SET_BONUS;
  if (bonus) store("glutwerk-glut", String(glutGet() + bonus));
  // spannend: die besten Karten zuletzt
  pulls.sort((a, b) => RORDER.indexOf(a.c.r) - RORDER.indexOf(b.c.r) || (a.foil - b.foil));
  startOpening(key, pulls, refund, sets);
}

/* ---- Partikel ---- */
const cv = $("fx"), cx2 = cv.getContext("2d");
const parts = [];
let raf = 0;
function fxResize() { const d = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * d; cv.height = innerHeight * d; cx2.setTransform(d, 0, 0, d, 0, 0); }
addEventListener("resize", fxResize);
function burst(x, y, c, n, sp) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (Math.random() * .8 + .2) * sp;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * .3, c, life: 1, d: .008 + Math.random() * .014, s: 1.5 + Math.random() * 3, g: .12, star: Math.random() < .25 });
  }

}
function rain(c) {
  for (let i = 0; i < 90; i++) parts.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6, vx: (Math.random() - .5) * 1.2, vy: 1.5 + Math.random() * 2.5, c: Math.random() < .3 ? "#fff" : c, life: 1, d: .004 + Math.random() * .004, s: 2 + Math.random() * 3, g: .03, star: true });
  loop();
}
function loop() {
  if (raf) return;
  const step = () => {
    cx2.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.life -= p.d;
      if (p.life <= 0 || p.y > innerHeight + 30) { parts.splice(i, 1); continue; }
      cx2.globalAlpha = Math.max(0, p.life);
      cx2.fillStyle = p.c; cx2.shadowColor = p.c; cx2.shadowBlur = 10;
      if (p.star) { cx2.save(); cx2.translate(p.x, p.y); cx2.rotate(p.life * 6); cx2.fillRect(-p.s, -p.s * .25, p.s * 2, p.s * .5); cx2.fillRect(-p.s * .25, -p.s, p.s * .5, p.s * 2); cx2.restore(); }
      else { cx2.beginPath(); cx2.arc(p.x, p.y, p.s, 0, 7); cx2.fill(); }
    }
    cx2.globalAlpha = 1; cx2.shadowBlur = 0;
    raf = parts.length ? requestAnimationFrame(step) : 0;
  };
  raf = requestAnimationFrame(step);
}

/* ---- Ton (selbst erzeugt, keine Dateien) ---- */
let ac = null, muted = store("glutwerk-cards-mute") === "1";
$("muteBtn").textContent = muted ? "🔇" : "🔊";
$("muteBtn").onclick = () => { muted = !muted; store("glutwerk-cards-mute", muted ? "1" : "0"); $("muteBtn").textContent = muted ? "🔇" : "🔊"; };
function audio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) { ac = null; } }
function tone(f, t0, dur, type = "sine", vol = .15, f2) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, ac.currentTime + t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, ac.currentTime + t0 + dur);
  g.gain.setValueAtTime(0, ac.currentTime + t0);
  g.gain.linearRampToValueAtTime(vol, ac.currentTime + t0 + .01);
  g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t0 + dur);
  o.connect(g).connect(ac.destination); o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + .05);
}
function noise(t0, dur, vol = .2, hp = 1200) {
  const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = b; f.type = "highpass"; f.frequency.value = hp; g.gain.value = vol;
  s.connect(f).connect(g).connect(ac.destination); s.start(ac.currentTime + t0);
}
function sfx(k) {
  if (muted || !ac) return;
  try {
    const arp = (notes, gap, type, vol, dur) => notes.forEach((n, i) => tone(n, i * gap, dur || .35, type, vol));
    ({
      tap: () => tone(220, 0, .12, "triangle", .2, 140),
      rumble: () => { tone(70, 0, .7, "sawtooth", .08, 110); noise(0, .6, .05, 300); },
      tear: () => { noise(0, .35, .35, 900); tone(600, 0, .25, "triangle", .08, 1400); },
      deal: () => noise(0, .08, .12, 2500),
      common: () => tone(660, 0, .15, "triangle", .1),
      rare: () => arp([660, 880], .08, "triangle", .12),
      epic: () => arp([523, 659, 784, 1047], .07, "triangle", .12, .4),
      legendary: () => { tone(98, 0, 1.2, "sawtooth", .07); arp([523, 659, 784, 1047, 1319, 1568], .07, "square", .05, .6); arp([1047, 1319, 1568], .09, "sine", .1, 1); },
      mythic: () => { tone(65, 0, 1.6, "sawtooth", .08); arp([440, 554, 659, 880, 1109, 1319, 1760], .06, "sine", .12, .9); arp([880, 1109, 1319, 1760], .12, "triangle", .06, 1.4); },
    })[k]?.();
  } catch (e) {}
}

/* ---- Glut aus anderen Tabs übernehmen ---- */
addEventListener("storage", e => { if (e.key === "glutwerk-glut") renderGlut(); if (e.key === "glutwerk-cards") { coll = loadColl(); renderAll(); } });

renderAll();
