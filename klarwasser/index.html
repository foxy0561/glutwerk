<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klarwasser</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: Becken-Bühne links mit Werkzeugleiste, Wasserwerte rechts, Fischliste darunter. Bewusst ein dunkles Aquarienzimmer am Abend. */
:root{
  --bg:#0c1d22; --panel:#122a31; --panel2:#17353d; --line:#244750; --fg:#e2eeea; --mut:#8eaea8;
  --acc:#f0b357; --acc-ink:#24170a; --ok:#6fd19a; --warn:#f2c94c; --bad:#ef6a5b; --band:rgba(111,209,154,.22);
  --fd:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.quest{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,#2a2412,#1c2e2a);border:1px solid #5a4a26}
.quest span{grid-column:1/-1;font:700 11px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.quest b{font-size:15px}
.quest em{font:normal 500 13px var(--fm);color:var(--acc);align-self:center}
.quest .qbar{grid-column:1/-1;height:4px;border-radius:2px;background:#0b1f24;margin-top:4px;overflow:hidden}
.quest .qbar i{display:block;height:100%;background:var(--acc)}
.quest.done{border-color:var(--ok)}
.clock .ev.bad{border-color:var(--bad);color:#ffb3a9} .clock .ev.warn{border-color:var(--warn);color:var(--warn)} .clock .ev.ok{border-color:var(--ok);color:var(--ok)}
.clock .who{font-size:13px}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h2{font:700 18px/1.2 var(--fd);margin:0}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:#3f727c}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.42;cursor:not-allowed}
button.on{background:#1f4a52;border-color:#4c8b93}
.acc{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:700}
.acc:hover:not(:disabled){filter:brightness(1.08)}
.danger{border-color:#7a3b35;color:#ffb3a9}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.logo{font:800 26px/1 var(--fd);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo svg{width:30px;height:30px}
.clock{color:var(--mut);display:flex;gap:8px;align-items:center}
.clock .dn{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.money{margin-left:auto;font:700 22px/1 var(--fm);color:var(--acc)}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-family:var(--fm);font-size:13px}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{display:flex;align-items:center;gap:8px;border-radius:99px;padding:7px 14px}
.tabs .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.tabs .dot.warn{background:var(--warn)} .tabs .dot.bad{background:var(--bad)}
.tabs small{color:var(--mut);font-family:var(--fm)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.stagecol{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#081418}
#tank{display:block;width:100%;aspect-ratio:2/1;max-width:100%;touch-action:manipulation;cursor:crosshair}
#tank.edit{touch-action:none;cursor:grab}
.hint{position:absolute;left:12px;bottom:10px;font-size:13px;background:rgba(8,20,24,.72);padding:5px 10px;border-radius:99px;color:var(--fg);pointer-events:none}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{display:flex;gap:6px;align-items:center}
.actions .ct{font:500 12px var(--fm);color:var(--mut)}
.actions .acc .ct{color:var(--acc-ink)}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{font-size:13px;padding:5px 10px;border-radius:99px}
.chipbtn b{font-family:var(--fm);font-weight:500;color:var(--acc)}
.editbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel2);border:1px dashed #4c8b93;border-radius:12px;padding:8px 12px}
.editbar .grow{flex:1;min-width:160px;color:var(--mut);font-size:14px}

.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.side h3{font:700 12px/1 var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0}
.vrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline}
.vrow .vl{font-size:14px;display:flex;align-items:center;gap:6px}
.vrow .vl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.vrow.warn .vl::before{background:var(--warn)} .vrow.bad .vl::before{background:var(--bad)} .vrow.nil .vl::before{background:var(--mut)}
.vrow .vv{font:500 13px var(--fm);font-variant-numeric:tabular-nums}
.vrow.bad .vv{color:var(--bad)} .vrow.warn .vv{color:var(--warn)}
.vbar{grid-column:1/-1;position:relative;height:6px;border-radius:3px;background:#0b1f24;overflow:visible}
.vbar i{position:absolute;top:0;bottom:0;background:var(--band);border-radius:3px}
.vbar b{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--fg);transform:translateX(-50%)}
.vrow.bad .vbar b{background:var(--bad)} .vrow.warn .vbar b{background:var(--warn)}
.vlist{display:flex;flex-direction:column;gap:9px}
.alarms{display:flex;flex-direction:column;gap:6px}
.al{display:grid;grid-template-columns:8px 1fr;gap:2px 8px;font-size:13px;padding:7px 9px;border-radius:9px;background:var(--panel2)}
.al::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--warn);grid-row:span 2}
.al.bad::before{background:var(--bad)}
.al span{color:var(--mut)}
.calm{font-size:13px;color:var(--ok)}
.meter2{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:14px}
.meter2 em{font:normal 500 12px var(--fm);color:var(--mut)}
.meter2 .bar{grid-column:1/-1;height:6px;border-radius:3px;background:#0b1f24;overflow:hidden}
.meter2 .bar i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.meter2.warn .bar i{background:var(--warn)} .meter2.bad .bar i{background:var(--bad)}
.econ{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding-top:4px;border-top:1px solid var(--line)}
.econ b{font-family:var(--fm);color:var(--acc)}

.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h span{color:var(--mut);font:500 13px var(--fm)}
.bags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.bag{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;flex:1 1 260px;min-width:0}
.bag .ring{width:38px;height:38px;flex:none}
.bag .bi{flex:1;min-width:0;font-size:14px}
.bag .bi small{display:block;color:var(--mut);font-size:12px}
.fishgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.fc{display:flex;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;min-width:0}
.fc.sel{border-color:var(--acc)}
.fc.dead{opacity:.7;border-style:dashed}
.fc canvas{width:72px;height:40px;flex:none;border-radius:8px;background:#0f3038}
.fc .fb{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.fc .fh{display:flex;justify-content:space-between;gap:6px;font-size:14px}
.fc .fh small{color:var(--mut);font-size:12px}
.mtr{display:grid;grid-template-columns:68px 1fr;gap:6px;align-items:center;font-size:11px;color:var(--mut)}
.mtr div{height:5px;border-radius:3px;background:#0b1f24;overflow:hidden}
.mtr i{display:block;height:100%;background:var(--ok)}
.mtr i.warn{background:var(--warn)} .mtr i.bad{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:1px 7px;border-radius:99px;background:#3a2321;color:#ffb3a9}
.chip.g{background:#1d3e33;color:#9fe3bd}
.chip.n{background:#203c44;color:var(--mut)}
.fa{display:flex;flex-wrap:wrap;gap:4px}
.fa button{font-size:12px;padding:3px 8px;border-radius:8px}
.empty{color:var(--mut);font-size:14px;padding:6px 2px}
footer{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.ver{color:var(--mut);font:500 12px var(--fm)}
footer button{font-size:13px;color:var(--mut)}

.modal{position:fixed;inset:0;z-index:40;background:rgba(4,12,15,.74);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(1000px,100%);max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet.small{width:min(520px,100%)}
.sh-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sh-h h2{font-size:22px}
.sh-h .x{margin-left:auto}
.stabs{display:flex;gap:6px;flex-wrap:wrap}
.stabs button{border-radius:99px;padding:6px 14px}
.into{font-size:13px;color:var(--mut)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px;min-width:0}
.item canvas{width:100%;aspect-ratio:2/1;max-width:100%;border-radius:8px;display:block;background:#0f3038}
.item .ih{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.item .ih b{font:700 15px var(--fd)}
.item .pr{font:500 13px var(--fm);color:var(--acc)}
.item .mat{font-size:12px;color:var(--mut)}
.item button{margin-top:auto}
.rg{display:grid;grid-template-columns:28px 1fr 52px;gap:6px;align-items:center;font-size:11px;color:var(--mut)}
.rg div{position:relative;height:6px;border-radius:3px;background:#0b1f24}
.rg div i{position:absolute;top:0;bottom:0;background:var(--band);border-radius:3px}
.rg div b{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--ok);transform:translateX(-50%)}
.rg.bad div b{background:var(--bad)}
.rg span{font-family:var(--fm);text-align:right}
.rg.bad span{color:var(--bad)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.pvrow{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 10px;font-size:14px;align-items:center}
.pvrow .num{font-size:13px}
.pvrow .to{color:var(--mut)}
.pvrow .bad{color:var(--bad)} .pvrow .warn{color:var(--warn)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--acc)}
.tech{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 10px;border-radius:10px;background:var(--panel2)}
.trow .tn{flex:1;min-width:140px}
.trow .tn small{display:block;color:var(--mut);font-size:12px}
.trow .tv{font:500 15px var(--fm);min-width:58px;text-align:center}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:#183a42;border:1px solid #2f5d66;border-left:4px solid var(--mut);padding:8px 12px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
@media (max-width:520px){.money{font-size:19px}.logo{font-size:22px}.speed button{padding:6px 8px}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="14" cy="16" rx="9" ry="6" fill="#f0b357"/><path d="M22 16l7-6v12z" fill="#f0b357"/><circle cx="10" cy="14.5" r="1.6" fill="#24170a"/></svg>Klarwasser</div>
    <div class="clock" id="clock"></div>
    <div class="money" id="money"></div>
    <div class="speed" id="speed"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main class="grid">
    <section class="stagecol">
      <div class="stage"><canvas id="tank"></canvas><div class="hint" id="hint" hidden></div></div>
      <div class="editbar" id="editbar" hidden></div>
      <div class="actions" id="actions"></div>
      <div class="inv" id="inv"></div>
    </section>
    <aside class="card side" id="values"></aside>
  </main>
  <section class="card">
    <div class="sec-h"><h2>Fische</h2><span id="fcount"></span></div>
    <div class="bags" id="bags"></div>
    <div class="fishgrid" id="fish"></div>
  </section>
  <footer><span class="ver">Klarwasser v1.1</span><button id="reset" data-a="reset">Neues Spiel</button></footer>
</div>

<div class="modal" id="m-shop" hidden><div class="sheet" id="shop"></div></div>
<div class="modal" id="m-wc" hidden><div class="sheet small" id="wc"></div></div>
<div class="modal" id="m-tech" hidden><div class="sheet small" id="tech"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

function shockOf(b,t){return Math.abs(b.temp-t.temp)*.5+Math.abs(b.ph-t.ph)*2.5+Math.abs(b.gh-t.gh)*.06;}
function fishStress(t,f,c){
  const s=SP[f.sp];let st=0;const why=[];
  const out=(v,r)=>v<r[0]?r[0]-v:v>r[1]?v-r[1]:0;
  let d=out(t.temp,s.t);if(d>0){st+=d*.35;why.push('temp');}
  d=out(t.ph,s.ph);if(d>0){st+=d*1.2;why.push('ph');}
  d=out(t.gh,s.gh);if(d>0){st+=d*.08;why.push('gh');}
  if(t.nh3>.05){st+=(t.nh3-.05)*5*(t.ph>7.5?1.6:1);why.push('nh3');}
  if(t.no2>.1){st+=(t.no2-.1)*4;why.push('no2');}
  if(t.no3>50){st+=(t.no3-50)/50;why.push('no3');}
  if(t.o2<5){st+=(5-t.o2)*.45;why.push('o2');}
  if(t.cu>.03){st+=(t.cu-.03)*(s.cu?30:4);why.push('cu');}
  if(t.cl>.02){st+=t.cl*3;why.push('cl');}
  if(f.hunger>.75){st+=(f.hunger-.75)*2.4;why.push('hunger');}
  if(c.crowd>1){st+=(c.crowd-1)*.5;why.push('crowd');}
  if(s.school&&c.count[f.sp]<s.school){st+=.18;why.push('group');}
  if(s.solo&&c.count[f.sp]>1){st+=.45;why.push('fight');}
  if(s.wood&&!c.wood){st+=.15;why.push('wood');}
  if(c.aggr&&!s.aggr&&s.len<60){st+=.2;why.push('bully');}
  if(s.tan&&t.tan>.2)st=Math.max(0,st-.08);

  if(t.algae>.03){const ra=rng(t.id*31+7);const n=Math.floor(t.algae*260);for(let i=0;i<n;i++){c.fillStyle=`rgba(${80+ra()*40},${130+ra()*40},50,${.25+ra()*.35})`;c.beginPath();c.arc(ra()*W,SURF+ra()*(GY-SURF),2+ra()*6,0,7);c.fill();}}
  // Beutel
  t.bags.forEach((b,i)=>{const bx=260+i*120;c.fillStyle='rgba(225,245,245,.16)';c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=1.5;c.beginPath();c.moveTo(bx-10,SURF-14);c.quadraticCurveTo(bx-38,SURF+40,bx,SURF+78);c.quadraticCurveTo(bx+38,SURF+40,bx+10,SURF-14);c.closePath();c.fill();c.stroke();
    const sb=SP[b.sp];drawFish(c,{x:bx+Math.sin(T*1.5+i)*6,y:SURF+42,dir:1,ph:T*6+i,id:b.id,size:b.size||1},sb,Math.min(46,sb.len*.6),t);
    const rd=clamp(1-shockOf(b,t)/1.2,0,1);c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=4;c.beginPath();c.arc(bx,SURF-20,9,0,7);c.stroke();c.strokeStyle=rd>.88?'#6fd19a':'#f2c94c';c.beginPath();c.arc(bx,SURF-20,9,-Math.PI/2,-Math.PI/2+rd*Math.PI*2);c.stroke();});
  // Oberfläche + Luft
  c.fillStyle='#0b1d22';c.fillRect(0,0,W,SURF);c.strokeStyle='rgba(220,245,250,.35)';c.lineWidth=2;c.beginPath();for(let x=0;x<=W;x+=10){const y=SURF+Math.sin(x*.03+T*1.6)*1.6;x?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();

  if(t.eq.fan){const run=t.eq.fanOn&&!isOut();c.save();c.translate(905,22);c.fillStyle='#2a3438';c.beginPath();c.arc(0,0,13,0,7);c.fill();c.rotate(run?T*14:0);c.fillStyle='#9fb3b6';for(let i=0;i<3;i++){c.rotate(Math.PI*2/3);c.beginPath();c.ellipse(6,0,6,2.6,0,0,7);c.fill();}c.restore();}

/* ---------- Animation ---------- */
function animate(rdt){
  const t=cur();T+=rdt;const sc=fishScale(t);
  for(const p of t.food){if(!p.settled){p.y+=p.vy*rdt;p.x+=Math.sin(T*2+p.id)*6*rdt;if(p.y>=p.gy){p.y=p.gy;p.settled=true;}}}
  const cen={};for(const f of t.fish)if(!f.dead){const c=cen[f.sp]||(cen[f.sp]={x:0,y:0,n:0});c.x+=f.x;c.y+=f.y;c.n++;}
  for(const f of t.fish){
    const s=SP[f.sp],len=s.len*sc*(.45+.55*f.size);
    if(f.dead){f.y+=(SURF+14-f.y)*Math.min(1,rdt*.5);continue;}
    const[z0,z1]=zone(s);let tx=f.tx,ty=f.ty,spd=s.spd*sc*(.6+.4*f.size),food=null;
    if(f.hunger>.06&&t.food.length){let bd=1e9;for(const p of t.food){if(p.settled&&!s.scav)continue;const d=Math.hypot(p.x-f.x,p.y-f.y);if(d<bd){bd=d;food=p;}}}
    if(food){tx=food.x;ty=food.y;spd*=2.2;}
    else{f.tt-=rdt;if(f.tt<=0||Math.hypot(tx-f.x,ty-f.y)<12||ty<z0-5||ty>z1+5){f.tx=tx=40+Math.random()*920;f.ty=ty=z0+Math.random()*(z1-z0);f.tt=2+Math.random()*5;}
      if(s.school&&cen[f.sp].n>1){const c=cen[f.sp];tx=tx*.4+c.x/c.n*.6;ty=ty*.4+c.y/c.n*.6;}}
    if(f.st>1.2)spd*=.5;
    const dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy)||1,v=d<30?spd*d/30:spd,k=Math.min(1,rdt*2.2);
    f.vx+=(dx/d*v-f.vx)*k;f.vy+=(dy/d*v-f.vy)*k;
    f.x=clamp(f.x+f.vx*rdt,24,976);f.y=clamp(f.y+f.vy*rdt,SURF+10,GY-6);
    if(f.vx>4)f.dir=1;else if(f.vx<-4)f.dir=-1;
    f.ph+=rdt*(5+Math.abs(f.vx)*.08);
    if(food&&d<len*.35+6)eatFood(t,f,food);
  }
  if(t.eq.air&&t.eq.airOn&&!isOut()&&Math.random()<rdt*14)bub.push({x:140+(Math.random()-.5)*10,y:GY-8,r:2+Math.random()*3.5});
  if(t.eq.co2&&t.eq.co2On&&!isOut()&&Math.random()<rdt*5)bub.push({x:63,y:GY-82,r:1.2});
  for(const b of bub){b.y-=(50+b.r*12)*rdt;b.x+=Math.sin(T*4+b.y*.05)*12*rdt;}
  bub=bub.filter(b=>b.y>SURF+2);
}

/* ---------- Eingabe ---------- */
function ptr(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{
  const t=cur(),p=ptr(e);
  if(edit){let best=null,bd=1e9;for(const o of[...t.deco,...t.plants]){const isD=!!DECO[o.t],w=isD?70:34,px=decoPX(o);const d=Math.abs(px-p.x);if(d<w&&p.y>GY-170&&d<bd){bd=d;best=o;}}
    editSel=best?{id:best.id,kind:DECO[best.t]?'d':'p'}:null;if(best){drag={o:best,off:p.x-decoPX(best)};cv.setPointerCapture(e.pointerId);}renderEdit();return;}
  const sc=fishScale(t);let hit=null,hd=1e9;for(const f of t.fish){const s=SP[f.sp],len=s.len*sc*(.45+.55*f.size);const d=Math.hypot(f.x-p.x,f.y-p.y);if(d<Math.max(18,len*.6)&&d<hd){hd=d;hit=f;}}
  if(hit){selFish=selFish===hit.id?null:hit.id;ui(true);return;}
  if(p.y>SURF&&p.y<GY)feed(false,p.x);
});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=ptr(e);drag.o.x=clamp((p.x-drag.off-60)/880,0,1);});
const endDrag=()=>{drag=null;};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

/* ---------- Aktionen ---------- */
function feedTank(t,frozen,x){
  const k=frozen?'frozen':'food';if(S.inv[k]<=0)return false;
  S.inv[k]--;S.st.fed++;const alive=t.fish.filter(f=>!f.dead).length;const n=clamp(Math.ceil(alive*.7)+1,2,20);
  const cx0=x==null?300+Math.random()*400:x;
  for(let i=0;i<n;i++)t.food.push({id:S.uid++,x:clamp(cx0+(Math.random()-.5)*80,30,970),y:SURF+2+Math.random()*6,vy:22+Math.random()*12,gy:GY-2-Math.random()*6,settled:false,age:0,frozen});
  return true;
}
function feed(frozen,x){
  if(!feedTank(cur(),frozen,x)){toast(frozen?'Kein Frostfutter mehr':'Kein Futter – im Shop kaufen','warn');return;}
  ui(true);
}
let wc={f:.25,cond:true,temper:true};
function wcPreview(t){const f=wc.f;const condOk=wc.cond&&S.inv.cond>0;
  return{temp:t.temp*(1-f)+(wc.temper?t.temp:TAP.temp)*f,ph:t.ph*(1-f)+TAP.ph*f,gh:t.gh*(1-f)+TAP.gh*f,no3:t.no3*(1-f)+TAP.no3*f,nh3:t.nh3*(1-f),no2:t.no2*(1-f),cl:condOk?0:t.cl*(1-f)+TAP.cl*f};}
function doWC(){
  const t=cur(),f=wc.f,pv=wcPreview(t),condOk=wc.cond&&S.inv.cond>0;
  const dT=Math.abs(pv.temp-t.temp),dP=Math.abs(pv.ph-t.ph);
  t.temp=pv.temp;t.phBase=t.phBase*(1-f)+TAP.ph*f;t.ph=pv.ph;t.ghBase=t.ghBase*(1-f)+TAP.gh*f;t.gh=pv.gh;
  t.nh3=pv.nh3;t.no2=pv.no2;t.no3=pv.no3;t.cu=t.cu*(1-f)+TAP.cu*f;t.tan*=1-f;t.mulm=Math.max(0,t.mulm*(1-f*1.5));t.cl=pv.cl;
  if(condOk)S.inv.cond--;
  t.food=t.food.filter(p=>!p.settled||Math.random()>f*1.6);
  let hurt=0;for(const x of t.fish){if(x.dead)continue;let d=0;if(dT>3)d+=(dT-2)*4;if(dP>.4)d+=(dP-.3)*20;if(d>0){x.hp-=d;hurt++;}}
  if(dT>3)t.ichRisk=24;S.st.wc++;t.blue*=1-f;
  if(t.med)t.med.left*=1-f*.8;
  $('#m-wc').hidden=true;toast(hurt?`${Math.round(f*100)} % gewechselt – Temperatur/pH-Sprung stresst die Fische`:`${Math.round(f*100)} % Wasser gewechselt`,hurt?'warn':'ok');ui(true);
}
function buy(kind,id){
  const t=cur();let price=0;

const memo={};
function setHTML(id,html){if(memo[id]!==html){memo[id]=html;$(id).innerHTML=html;return true;}return false;}
function band(t,key){let lo=-1e9,hi=1e9,any=false;for(const f of t.fish){if(f.dead)continue;const r=SP[f.sp][key];lo=Math.max(lo,r[0]);hi=Math.min(hi,r[1]);any=true;}return any?[lo,hi]:null;}
function tankLevel(t){let lv=0;for(const f of t.fish){if(f.dead){lv=2;continue;}if(f.st>.6)lv=2;else if(f.st>.15)lv=Math.max(lv,1);}if(t.nh3>.25||t.no2>.3||t.cl>.05||t.cu>.08||t.o2<4.5)lv=2;else if(t.nh3>.1||t.no2>.15||t.no3>40||t.algae>.4)lv=Math.max(lv,1);return lv;}
function alarms(t){
  const a=[],alive=t.fish.filter(f=>!f.dead);
  if(t.cl>.02)a.push(['bad','Chlor im Wasser','Aufbereiter dosieren']);
  if(t.fish.some(f=>f.dead))a.push(['bad','Toter Fisch im Becken','entfernen, sonst Ammonium']);
  if(isOut())a.push(['bad','Stromausfall','Technik ist aus – nicht füttern']);
  for(const k in DIS){const n=alive.filter(f=>f.dis===k).length;if(n&&!(t.med&&t.med.k===DIS[k].med))a.push(['bad',`${DIS[k].n} (${n})`,`${CARE[DIS[k].med].n} benutzen${k==='ich'?' · kranke Fische umsetzen':''}`]);}
  if(t.snails>60)a.push(['warn',`${Math.round(t.snails)} Schnecken`,'weniger füttern, Falle oder Kugelfisch']);
  if(t.no2>.15)a.push([t.no2>.3?'bad':'warn','Nitrit hoch','Bakterien zu schwach – Wasser wechseln']);
  if(t.nh3>.1)a.push([t.nh3>.25?'bad':'warn','Ammonium hoch','weniger füttern, Wasser wechseln']);
  if(t.cu>.04)a.push([t.cu>.08?'bad':'warn','Metalle im Wasser','Deko prüfen, Aktivkohle']);
  if(t.o2<5.5)a.push([t.o2<4.5?'bad':'warn','Wenig Sauerstoff','Luftpumpe oder weniger Fische']);
  for(const[k,lab]of[['t','Temperatur'],['ph','pH'],['gh','Härte']]){const b=band(t,k);if(b&&b[0]>b[1])a.push(['warn',`${lab}: Fische passen nicht zusammen`,'brauchen verschiedenes Wasser']);}
  const outs={};for(const f of alive)for(const w of f.why)if(['temp','ph','gh'].includes(w))(outs[w]=outs[w]||new Set()).add(SP[f.sp].n);
  for(const w in outs)a.push(['warn',`${WHY[w]} passt nicht`,[...outs[w]].join(', ')]);
  if(t.no3>40)a.push(['warn','Nitrat hoch','Wasserwechsel, mehr Pflanzen']);
  if(t.algae>.35)a.push(['warn','Algen','Licht, Nitrat runter, Pflanzen rein']);
  if(!t.eq.filter)a.push(['warn','Kein Filter','Bakterien wachsen schlecht']);
  if(!t.eq.heater&&alive.some(f=>SP[f.sp].t[0]>21.5))a.push(['warn','Kein Heizstab','Wasser bleibt bei Raumtemperatur']);
  const hg=alive.filter(f=>f.hunger>.7).length;if(hg)a.push(['warn',`${hg} Fisch${hg>1?'e':''} hungrig`,'Füttern oder ins Becken tippen']);
  return a.slice(0,4);
}

  <div class="into">Für: <b>${t.name}</b> (${t.L} L) · Markierung = aktueller Wert im Becken</div><div class="shopgrid">`;
  const btn=(kind,id,price,label,dis)=>`<button class="acc" data-a="buy" data-k="${kind}" data-id="${id}" ${S.money<price||dis?'disabled':''}>${label}</button>`;
  if(shopTab==='fish')for(const k in SP){const s=SP[k];const tags=[];if(s.school)tags.push(`Gruppe ab ${s.school}`);if(s.solo)tags.push('nur einer');if(s.pred)tags.push('frisst Kleine');if(s.prey)tags.push('wird gefressen');if(s.cu)tags.push('metallempfindlich');if(s.algae)tags.push('frisst Algen');if(s.scav)tags.push('frisst Reste');if(s.wood)tags.push('braucht Holz');if(s.live)tags.push('bekommt Junge');if(s.aggr)tags.push('aggressiv');if(s.snail)tags.push('frisst Schnecken');if(s.bio>=3.5)tags.push('viel Dreck');
    h+=`<div class="item"><canvas width="240" height="120" data-pv="fish:${k}"></canvas><div class="ih"><b>${s.n}</b><span class="pr">${s.price} €</span></div>${rangeMini('°C',s.t,t.temp,10,34)}${rangeMini('pH',s.ph,t.ph,5,9)}${rangeMini('GH',s.gh,t.gh,0,30)}<div class="chips">${tags.map(x=>`<span class="chip n">${x}</span>`).join('')}</div>${btn('fish',k,s.price,'In den Beutel')}</div>`;}
  if(shopTab==='eq')for(const k in EQ){const E=EQ[k],has=eqHas(t,k);h+=`<div class="item"><div class="ih"><b>${E.n}</b><span class="pr">${E.price} €</span></div><div class="mat">${E.d}</div>${E.slot==='filter'&&t.eq.filter&&!has?`<div class="mat">ersetzt ${EQ[t.eq.filter].n}</div>`:''}${btn('eq',k,E.price,has?'Eingebaut':'Einbauen',has)}</div>`;}
  if(shopTab==='deco'){for(const k in DECO){const D=DECO[k],kn=!D.hidden||S.known[k];h+=`<div class="item"><canvas width="240" height="120" data-pv="deco:${k}"></canvas><div class="ih"><b>${D.n}</b><span class="pr">${D.price?D.price+' €':'gratis'}</span></div><div class="mat">Material: ${D.mat}</div><div class="chips">${kn?effChips(D):'<span class="chip n">Wirkung: ?</span>'}</div>${btn('deco',k,D.price,'Ins Becken')}</div>`;}
    for(const k in SUB){const B=SUB[k];h+=`<div class="item"><canvas width="240" height="120" data-pv="sub:${k}"></canvas><div class="ih"><b>${B.n}</b><span class="pr">${B.price} €</span></div><div class="mat">Bodengrund · ${B.mat}</div><div class="chips">${effChips(B)}</div>${btn('sub',k,B.price,t.sub===k?'Liegt drin':'Austauschen',t.sub===k)}</div>`;}}
  if(shopTab==='plant')for(const k in PL){const P=PL[k];const d=P.fast?'wächst schnell, frisst viel Nitrat':P.shade?'beschattet, bremst Algen':P.rate<1?'langsam, robust':'frisst Nitrat';h+=`<div class="item"><canvas width="240" height="120" data-pv="plant:${k}"></canvas><div class="ih"><b>${P.n}</b><span class="pr">${P.price} €</span></div><div class="mat">${d}</div>${btn('plant',k,P.price,'Einpflanzen')}</div>`;}
  if(shopTab==='care')for(const k in CARE){const C=CARE[k];h+=`<div class="item"><div class="ih"><b>${C.n}</b><span class="pr">${C.price} €</span></div><div class="mat">${C.d}</div><div class="mat">Vorrat: <b class="num">${S.inv[k]||0}</b></div>${btn('care',k,C.price,'Kaufen')}</div>`;}
  if(shopTab==='tank')for(const k of TANKS){const full=S.tanks.length>=MAXT;h+=`<div class="item"><canvas width="240" height="120" data-pv="tank:${k.L}"></canvas><div class="ih"><b>${k.L} Liter</b><span class="pr">${k.price} €</span></div><div class="mat">leer, mit Lampe · ${S.tanks.length}/${MAXT} Becken</div>${btn('tank',k.L,k.price,full?'Kein Platz':'Aufstellen',full)}</div>`;}
  h+='</div>';$('#shop').innerHTML=h;
  for(const c of document.querySelectorAll('[data-pv]')){const[kind,id]=c.dataset.pv.split(':');const x=c.getContext('2d'),w=c.width,hh=c.height;pvBg(x,w,hh);
    if(kind==='fish')pvFish(c,id);
    else if(kind==='deco'){x.save();x.translate(w/2,hh-8);x.scale(.62,.62);drawDeco(x,{t:id,s:1,seed:42,age:0},0,0);x.restore();}
    else if(kind==='sub'){const B=SUB[id];x.fillStyle=B.c[0];x.fillRect(0,hh*.55,w,hh);const r=rng(9);x.fillStyle=B.c[1];for(let i=0;i<120;i++)x.fillRect(r()*w,hh*.58+r()*hh*.4,3,3);}
    else if(kind==='plant'){x.save();x.translate(w/2,hh-6);x.scale(.42,.42);drawPlant(x,{t:id,h:.8,seed:11},0,0,-hh*2+30);x.restore();}
    else if(kind==='tank'){const L=+id,tw=w*(.3+.6*Math.sqrt(L/240)),th=tw*.5;x.fillStyle='rgba(120,200,210,.35)';x.fillRect((w-tw)/2,hh-th-10,tw,th);x.strokeStyle='rgba(220,240,240,.6)';x.lineWidth=2;x.strokeRect((w-tw)/2,hh-th-10,tw,th);}}
}
function renderWC(){const t=cur(),pv=wcPreview(t),bt=band(t,'t'),bp=band(t,'ph');
  const cls=(v,b)=>b&&(v<b[0]||v>b[1])?'bad':'';
  const row=(l,a,b,f,c)=>`<span>${l}</span><span class="num">${f(a)}</span><span class="to">→</span><span class="num ${c||''}">${f(b)}</span>`;
  $('#wc').innerHTML=`<div class="sh-h"><h2>Wasserwechsel</h2><button class="x" data-a="close">Abbrechen</button></div>
  <div class="opts">${[.1,.25,.5,.75].map(f=>`<button data-a="wcf" data-v="${f}" class="${wc.f===f?'on':''}">${f*100} %</button>`).join('')}</div>
  <label class="toggle"><input type="checkbox" id="wc-cond" ${wc.cond?'checked':''} ${S.inv.cond>0?'':'disabled'}> Wasseraufbereiter benutzen (${S.inv.cond} übrig)</label>
  <label class="toggle"><input type="checkbox" id="wc-temp" ${wc.temper?'checked':''}> Neues Wasser auf Beckentemperatur bringen</label>
  <div class="pvrow">${row('Temperatur',t.temp,pv.temp,v=>v.toFixed(1)+' °C',cls(pv.temp,bt)||(Math.abs(pv.temp-t.temp)>3?'warn':''))}${row('pH',t.ph,pv.ph,v=>v.toFixed(2),cls(pv.ph,bp)||(Math.abs(pv.ph-t.ph)>.4?'warn':''))}${row('Härte',t.gh,pv.gh,v=>v.toFixed(1),'')}${row('Ammonium',t.nh3,pv.nh3,v=>v.toFixed(2),'')}${row('Nitrit',t.no2,pv.no2,v=>v.toFixed(2),'')}${row('Nitrat',t.no3,pv.no3,v=>v.toFixed(0),'')}${row('Chlor',t.cl,pv.cl,v=>v.toFixed(2),pv.cl>.02?'bad':'')}</div>
  <button class="acc" data-a="wcgo">${Math.round(wc.f*100)} % wechseln</button>`;}
function renderTech(){const t=cur(),E=t.eq;const r=(n,sub,ctrl)=>`<div class="trow"><div class="tn"><b>${n}</b><small>${sub}</small></div>${ctrl}</div>`;
  const tg=(k,on)=>`<button data-a="tg" data-v="${k}" class="${on?'on':''}">${on?'An':'Aus'}</button>`;
  const buyHint=k=>`<button data-a="shop" data-v="eq">Kaufen</button>`;
  $('#tech').innerHTML=`<div class="sh-h"><h2>Technik · ${t.name}</h2><button class="x" data-a="close">Schließen</button></div><div class="tech">
  ${r('Filter',E.filter?EQ[E.filter].n:'kein Filter',E.filter?'':buyHint())}
  ${r('Heizstab',E.heater?`heizt ${t.heating?'gerade':'nicht'} · Wasser ${t.temp.toFixed(1)} °C`:'nicht vorhanden',E.heater?`<button data-a="heat" data-v="-0.5" aria-label="kälter">−</button><span class="tv">${E.heater.set.toFixed(1)} °C</span><button data-a="heat" data-v="0.5" aria-label="wärmer">+</button>`:buyHint())}
  ${r('Licht',`${E.light>1?'LED':'Standard'} · Zeitschaltuhr 8–20 Uhr`,tg('lightOn',E.lightOn))}
  ${r('Luftpumpe',E.air?'Sauerstoff':'nicht vorhanden',E.air?tg('airOn',E.airOn):buyHint())}
  ${r('CO₂-Anlage',E.co2?'Pflanzendünger, senkt pH':'nicht vorhanden',E.co2?tg('co2On',E.co2On):buyHint())}
  ${r('UV-Klärer',E.uv?'gegen Schwebealgen':'nicht vorhanden',E.uv?tg('uvOn',E.uvOn):buyHint())}
  ${r('Lüfter',E.fan?'kühlt das Wasser um bis zu 2,5 °C':'nicht vorhanden',E.fan?tg('fanOn',E.fanOn):buyHint())}
  ${r('Futterautomat',E.feeder?`füttert täglich um 9 Uhr · ${S.inv.food} Portionen übrig`:'nicht vorhanden',E.feeder?tg('feederOn',E.feederOn):buyHint())}
  ${isOut()?'<div class="al bad"><b>Stromausfall</b><span>Alle Geräte stehen still, bis der Strom zurück ist.</span></div>':''}
  </div>`;}

/* ---------- Klicks ---------- */
let resetArm=0;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,id=+b.dataset.id;
  if(b.tagName!=='BUTTON'&&a!=='sel')return;
  if(a==='sel'){if(e.target.closest('button'))return;selFish=selFish===id?null:id;ui(true);return;}
  e.stopPropagation();
  switch(a){
  case 'speed':S.speed=+v;break;
  case 'tab':S.cur=+v;bub=[];selFish=null;editSel=null;renderEdit();break;
  case 'feed':feed(false);break;case 'frozen':feed(true);break;
  case 'wc':wc.cond=S.inv.cond>0;renderWC();$('#m-wc').hidden=false;break;
  case 'wcf':wc.f=+v;renderWC();break;case 'wcgo':doWC();break;
  case 'clean':cur().algae*=.6;toast('Scheiben geputzt','ok');break;
  case 'edit':edit=!edit;editSel=null;selFish=null;renderEdit();break;
  case 'selldeco':sellDeco();break;
  case 'tech':renderTech();$('#m-tech').hidden=false;break;
  case 'tg':cur().eq[v]=!cur().eq[v];renderTech();break;
  case 'heat':{const h=cur().eq.heater;h.set=clamp(h.set+ +v,18,32);renderTech();break;}
  case 'shop':closeAll();if(v)shopTab=v;renderShop();$('#m-shop').hidden=false;break;
  case 'stab':shopTab=v;renderShop();break;
  case 'buy':buy(b.dataset.k,b.dataset.id);break;
  case 'close':closeAll();break;
  case 'use':useItem(v);break;
  case 'release':release(id);break;
  case 'sell':sell(id);break;case 'rmdead':removeDead(id);break;
  case 'move':moveFish(id,+b.dataset.t);break;
  case 'reset':if(Date.now()-resetArm<3000){S=null;fresh();edit=false;selFish=null;bub=[];closeAll();save();b.textContent='Neues Spiel';resetArm=0;}else{resetArm=Date.now();b.textContent='Wirklich neu starten?';setTimeout(()=>{b.textContent='Neues Spiel';},3000);}break;
  }
  ui(true);
});
document.addEventListener('change',e=>{if(e.target.id==='wc-cond'){wc.cond=e.target.checked;renderWC();}if(e.target.id==='wc-temp'){wc.temper=e.target.checked;renderWC();}});
for(const m of document.querySelectorAll('.modal'))m.addEventListener('click',e=>{if(e.target===m)m.hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();});

/* ---------- Meldungen ---------- */
function toast(msg,kind){const box=$('#toasts');const d=document.createElement('div');d.className='toast '+(kind||'');d.textContent=msg;box.appendChild(d);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>d.remove(),4200);}

/* ---------- Start ---------- */
function start(data){
  S=(data&&data.S)||load()||fresh();
  window.claude?.hot?.snapshot?.(()=>({S}));
  fit();ui(true);
  let last=performance.now(),acc=0,saveT=0;
  function frame(now){const rdt=Math.min(.1,(now-last)/1000);last=now;
    let gh=rdt*S.speed*.1;while(gh>0){const d=Math.min(.05,gh);simAll(d);gh-=d;}
    animate(rdt);draw();acc+=rdt;saveT+=rdt;
    if(acc>.3){acc=0;ui(false);if(!$('#m-shop').hidden){for(const bt of document.querySelectorAll('#shop [data-a="buy"]')){}}}
    if(saveT>5){saveT=0;save();}
    requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
  window.addEventListener('pagehide',save);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
