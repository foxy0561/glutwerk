<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Letzter Dreh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&family=VT323&family=Caveat:wght@600&display=swap">
<style>
/* Layout: first-person view into a concrete cellar, drawn on a fixed design stage (landscape 1280×800, portrait 700×1240) scaled to fit.
   Back wall + floor with parallax, swaying bulb lights the room, dirty slot cabinet in the middle with its own LED readouts. */
:root{
  --black:#050304; --rust:#7a3b1c; --gold:#f2b33d; --gold-dim:#a87a24; --red:#e3443a; --win:#5fd38d;
  --text:#efe6dd; --muted:#9c8f8a; --led-red:#ff4a3a; --led-amb:#ffb02e; --led-grn:#7dff8a;
  --f-display:"Bungee","Impact",system-ui,sans-serif;
  --f-body:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --f-led:"VT323",ui-monospace,monospace;
  --f-hand:"Caveat","Comic Sans MS",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
::selection{background:transparent}
svg,img{-webkit-user-drag:none}
body{background:var(--black);color:var(--text);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font-family:var(--f-body);cursor:pointer;border:0;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button:disabled{cursor:not-allowed}

.viewport{position:fixed;inset:0;overflow:hidden;background:var(--black)}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#0b0907}
.L{width:1280px;height:800px} .P{width:700px;height:1240px}
.abs{position:absolute}

/* ---------- room ---------- */
.world{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform}
.backdrop{position:absolute;top:0;bottom:0;left:-400px}
.L .backdrop{width:2080px} .P .backdrop{width:1500px}
.bd-wall{position:absolute;left:0;right:0;top:0;background-image:var(--noise),radial-gradient(ellipse at 22% 70%,rgba(60,40,20,.35),transparent 25%),radial-gradient(ellipse at 70% 20%,rgba(0,0,0,.4),transparent 30%),linear-gradient(#3b3631,#2b2723 60%,#221e1b);background-blend-mode:multiply,normal,normal,normal}
.bd-wall::before{content:"";position:absolute;inset:0;opacity:.18;background-image:linear-gradient(#000 2px,transparent 2px),linear-gradient(90deg,#000 2px,transparent 2px);background-size:160px 80px;mix-blend-mode:multiply}
.bd-wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.L .bd-wall{height:560px} .P .bd-wall{height:960px}
.bd-floor{position:absolute;left:0;right:0;bottom:0;background-image:var(--noise),repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 3px,transparent 3px 140px),linear-gradient(#1d1916,#0e0c0a);background-blend-mode:multiply,normal,normal}
.L .bd-floor{top:560px} .P .bd-floor{top:960px}
.par{position:absolute;inset:-40px;pointer-events:none}
.par .note,.par .phone,.par .door{pointer-events:auto}
.prop,.backdrop,.bulbwrap{pointer-events:none}
.wall{position:absolute;left:0;right:0;top:0}
.L .wall{height:600px} .P .wall{height:1000px}


.floor{position:absolute;left:0;right:0;bottom:0}
.L .floor{top:600px} .P .floor{top:1000px}
.puddle{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(120,140,150,.22),transparent 70%)}
.pipe{position:absolute;background:linear-gradient(#5a524c,#2a2420 60%,#15110f);border-radius:12px;box-shadow:0 6px 10px rgba(0,0,0,.6)}
.pipe.h{left:-400px;right:-400px;top:40px;height:26px}
.pipe.v{width:26px;top:40px;bottom:0;background:linear-gradient(90deg,#5a524c,#2a2420 60%,#15110f)}
.L .pipe.v{left:1235px} .P .pipe.v{left:20px}
.drip{position:absolute;width:4px;height:8px;border-radius:2px;background:rgba(160,180,190,.6);animation:drip 3.4s infinite ease-in}
.L .drip{left:1246px;top:70px} .P .drip{left:31px;top:70px}
@keyframes drip{0%,60%{transform:translateY(0);opacity:0}62%{opacity:1}100%{transform:translateY(520px);opacity:.2}}
.stain{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(70,40,15,.55),transparent 70%)}
.tally{position:absolute;opacity:.7}
.L .tally{left:300px;top:270px} .P .tally{left:500px;top:110px}
.crack{position:absolute;opacity:.6}

.note{position:absolute;background:linear-gradient(#e8dcc0,#cdbd9a);color:#2a2018;padding:14px 16px;font-family:var(--f-hand);font-size:24px;line-height:1.05;
  box-shadow:4px 6px 12px rgba(0,0,0,.6);transform:rotate(-4deg);cursor:pointer;text-align:left}
.note::before{content:"";position:absolute;top:-6px;left:50%;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8b7d,#8a1a12);margin-left:-7px}
.note::after{content:"";position:absolute;inset:0;background:var(--noise);mix-blend-mode:multiply;opacity:.35;pointer-events:none}
.note small{display:block;font-size:17px;color:#6a4a2a;margin-top:6px}
.L .note{left:70px;top:110px;width:200px} .P .note{left:24px;top:60px;width:180px;font-size:22px}

.phone{position:absolute;cursor:pointer;background:none;padding:0}
.L .phone{left:160px;top:300px;width:110px;height:180px} .P .phone{left:50px;top:440px;width:70px;height:130px}
.P .phone .lab{font-size:10px;letter-spacing:.1em}
.phone .plate{position:absolute;inset:0;border-radius:10px;background:linear-gradient(#2b201b,#140e0b);box-shadow:inset 0 0 0 2px #3e2e25,0 8px 16px rgba(0,0,0,.7)}
.phone .dial{position:absolute;left:50%;top:44%;width:56%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ddd2c0 0 28%,#111 29% 31%,#2a2420 32%);box-shadow:inset 0 0 0 3px #0c0807}
.phone .hand{position:absolute;left:10%;right:10%;top:6%;height:18%;border-radius:12px;background:linear-gradient(#3a2c25,#191210);box-shadow:0 3px 0 #000}
.phone .cord{position:absolute;left:12%;top:70%;width:40%;height:46%}
.phone .lab{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:12px;letter-spacing:.2em;color:#9a8478}
.phone.ring{animation:ring .12s 6}
@keyframes ring{50%{transform:rotate(3deg)}}
.phone.used{filter:brightness(.6)}

.door{position:absolute;background:linear-gradient(90deg,#2d2a28,#45403b 50%,#2a2624);border:6px solid #1a1715;box-shadow:inset 0 0 40px rgba(0,0,0,.7)}
.L .door{left:960px;top:150px;width:230px;height:450px} .P .door{left:600px;top:330px;width:170px;height:670px}
.door::before{content:"";position:absolute;inset:0;background:var(--noise),radial-gradient(ellipse at 40% 80%,rgba(110,55,20,.5),transparent 50%);mix-blend-mode:multiply;opacity:.9}
.door .hatch{position:absolute;left:22%;right:22%;top:46%;height:40px;background:#161311;border:3px solid #0d0b0a;transition:transform .5s;transform-origin:50% 0}
.door.open .hatch{transform:scaleY(.1)}
.door .hatchlight{position:absolute;left:22%;right:22%;top:46%;height:40px;background:#ffcf7a;opacity:0;transition:opacity .5s;box-shadow:0 0 30px #ffb03a}
.door.open .hatchlight{opacity:.85}
.door .knob{position:absolute;left:12%;top:52%;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b9aa98,#4a3f36)}
.door .gap{position:absolute;left:0;right:0;bottom:-10px;height:4px;background:#ffcf7a;box-shadow:0 0 18px 4px rgba(255,190,90,.55);overflow:hidden}
.door .gap i{position:absolute;top:0;bottom:0;width:30%;background:#000;left:-35%}
@keyframes walk{0%{left:-35%}45%,60%{left:35%}100%{left:105%}}
.door{cursor:pointer}
.door .slit{position:absolute;left:26%;right:26%;top:12%;height:30px;background:#030202;overflow:hidden;box-shadow:0 0 0 4px #1a1715,inset 0 0 10px #000}
.door .slit i{position:absolute;top:50%;width:12px;height:7px;margin-top:-3px;border-radius:50%;background:#ffd36a;box-shadow:0 0 10px 3px rgba(255,190,70,.8);opacity:0;transition:opacity .4s .45s}
.door .slit i:nth-of-type(1){left:28%} .door .slit i:nth-of-type(2){right:28%}
.door.peek .slit i{opacity:1;animation:blinkeye 3.2s infinite 1s}
.door .shutter{position:absolute;inset:0;background:linear-gradient(#77706a,#4a4540 50%,#36322e);box-shadow:inset 0 0 0 2px #26221f;transition:transform .55s cubic-bezier(.65,0,.35,1)}
.door .shutter::after{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#26221f}
.door.peek .shutter,.door.aim .shutter{transform:translateX(104%)}
.door .barrel{position:absolute;left:50%;top:50%;width:46px;height:22px;margin:-11px 0 0 -23px;opacity:0;transition:opacity .2s .5s;
  background:radial-gradient(circle at 25% 50%,#000 0 6px,#8a8580 7px 9px,#3a3632 10px,transparent 11px),radial-gradient(circle at 75% 50%,#000 0 6px,#8a8580 7px 9px,#3a3632 10px,transparent 11px)}
.door.aim .barrel{opacity:1} .door.aim .slit i{opacity:0!important;transition-delay:0s}
.ceiling{position:absolute;inset:-60px;z-index:30;pointer-events:none;transform:translateY(-110%);overflow:hidden;
  background-image:var(--noise),radial-gradient(circle at 50% 46%,rgba(255,200,120,.35),transparent 30%),linear-gradient(#26221e,#1a1714);background-blend-mode:multiply,normal,normal;transition:filter 5s}
.ceiling .cpipe{position:absolute;left:-10%;right:-10%;height:34px;background:linear-gradient(#5a524c,#2a2420 60%,#15110f);border-radius:17px;box-shadow:0 10px 20px rgba(0,0,0,.6)}
.ceiling .rose{position:absolute;left:50%;top:46%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#2e2a26;box-shadow:0 0 0 6px #1d1a17}
.ceiling .cbulb{position:absolute;left:50%;top:46%;width:64px;height:64px;margin:-32px;border-radius:50%;background:radial-gradient(circle,#fffbe8,#ffd27a 45%,#c27a2a 70%);box-shadow:0 0 80px 40px rgba(255,200,110,.5);animation:csway 3s ease-in-out infinite alternate}
@keyframes csway{from{transform:translate(-26px,8px)}to{transform:translate(26px,-6px)}}
.ceiling .cstain{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(70,45,20,.6),transparent 70%)}
.ceiling .cdark{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,transparent 18%,rgba(0,0,0,.85) 70%)}
.stage.electro{animation:estrobe .09s steps(2) infinite}
@keyframes estrobe{50%{filter:brightness(1.9) contrast(1.5) saturate(.3) hue-rotate(-25deg)}}
html.calm .stage.electro{animation:none}
.rig.electro{animation:ejitter .06s infinite}
@keyframes ejitter{25%{transform:translate(-4px,1px) rotate(-.3deg)}50%{transform:translate(3px,-2px)}75%{transform:translate(-1px,3px) rotate(.3deg)}}
.cabinet.deadc{filter:brightness(.1)}
.spark{position:absolute;z-index:9!important;width:3px;border-radius:2px;background:#eef9ff;box-shadow:0 0 6px 2px #9fd4ff,0 0 16px 4px rgba(120,180,255,.6);pointer-events:none;animation:sparkf .16s ease-out forwards}
@keyframes sparkf{0%{opacity:1}100%{opacity:0;transform:var(--r) scaleY(.3)}}
.spark.fall{z-index:25!important;width:4px;height:4px;border-radius:50%;background:#ffd27a;box-shadow:0 0 8px 3px #ff9a3a;animation:sfall 1.3s cubic-bezier(.4,0,1,1) forwards}
@keyframes sfall{to{transform:translate(var(--dx),340px);opacity:0}}
.shotflash{position:fixed;inset:0;z-index:39;pointer-events:none;background:#fff;animation:shot .5s ease-out forwards}
@keyframes shot{0%{opacity:1}30%{opacity:.6;background:#ffd9a0}100%{opacity:0}}
.bleed{position:fixed;inset:0;z-index:38;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 15%,rgba(110,0,0,.85) 75%,#1a0000 100%);opacity:0;transition:opacity 3.5s ease-in}
.bleed.on{opacity:1}
.bleed.black{background:#000;opacity:1;transition:none}
@keyframes blinkeye{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
.door.knock{animation:knock .18s}
@keyframes knock{50%{transform:translateY(1px) scale(1.004)}}
.ov.low{background:rgba(5,3,4,.35);align-items:flex-end}
.ov.low .sheet{margin:auto auto 0}

.bulbwrap{position:absolute;top:0;width:2px;height:150px;transform-origin:50% 0}
.L .bulbwrap{left:330px} .P .bulbwrap{left:350px;height:120px}
.bulbwrap .cord{position:absolute;left:0;top:0;bottom:0;width:2px;background:#111}
.bulbwrap .bulb{position:absolute;left:-14px;bottom:-30px;width:30px;height:38px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 40%,#fff6d0,#ffcf6a 45%,#b8742a);box-shadow:0 0 30px 10px rgba(255,200,110,.55)}
.bulbwrap .bulb::before{content:"";position:absolute;left:8px;top:-10px;width:14px;height:12px;background:#3a332c;border-radius:2px}
.bulbwrap.off .bulb{background:#4a3f2e;box-shadow:none}

.dark{position:absolute;top:0;bottom:0;left:-400px;pointer-events:none;z-index:20}
.L .dark{width:2080px} .P .dark{width:1500px}
.chain{position:absolute;inset:0;pointer-events:none;z-index:4}

/* ---------- props around the room ---------- */
.prop{position:absolute}
.cam{width:70px;height:40px}
.L .cam{left:-190px;top:70px} .P .cam{left:-190px;top:90px}
.cam .mnt{position:absolute;left:30px;top:-70px;width:8px;height:74px;background:#1d1a18}
.cam .body{position:absolute;inset:0;border-radius:6px;background:linear-gradient(#c9c3ba,#6f6a63);transform:rotate(18deg);box-shadow:0 6px 10px rgba(0,0,0,.6)}
.cam .lens{position:absolute;right:-10px;top:8px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#4a5a6a,#05070a 60%);transform:rotate(18deg)}
.cam .led{position:absolute;left:8px;top:8px;width:7px;height:7px;border-radius:50%;background:#ff2a1a;box-shadow:0 0 10px 3px rgba(255,40,20,.7);animation:led 1.6s steps(2) infinite}
@keyframes led{50%{opacity:.15;box-shadow:none}}
.shelf{width:240px;height:130px}
.L .shelf{left:-330px;top:250px} .P .shelf{left:-320px;top:430px}
.shelf .board{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(#5a3e26,#2e1f12);box-shadow:0 8px 10px rgba(0,0,0,.6)}
.shelf .br{position:absolute;bottom:-28px;width:8px;height:30px;background:#2a2a2a}
.jar{position:absolute;bottom:12px;border-radius:8px 8px 6px 6px;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(90,110,60,.55) 40%,rgba(40,50,25,.8));box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.jar::before{content:"";position:absolute;left:-2px;right:-2px;top:-8px;height:9px;background:#4a3a2a;border-radius:3px}
.toolbox{position:absolute;bottom:12px;right:8px;width:80px;height:44px;background:linear-gradient(#8c2a1e,#4f140d);border-radius:4px}
.toolbox::before{content:"";position:absolute;left:24px;top:-10px;width:32px;height:12px;border:4px solid #2a2a2a;border-bottom:0;border-radius:6px 6px 0 0}
.mattress{width:280px;height:80px;border-radius:10px;background:var(--noise),repeating-linear-gradient(90deg,#6c6a5e 0 18px,#5d5b51 18px 36px);background-blend-mode:multiply;transform:skewX(-14deg);box-shadow:0 10px 18px rgba(0,0,0,.7)}
.mattress::after{content:"";position:absolute;left:40%;top:20%;width:90px;height:40px;border-radius:50%;background:radial-gradient(ellipse,rgba(80,55,20,.6),transparent 70%)}
.L .mattress{left:-340px;top:640px} .P .mattress{left:-330px;top:1060px}
.vent{width:130px;height:76px;background:#141210;border:5px solid #4a4540;border-radius:4px;overflow:hidden}
.vent::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(#4a4540 0 6px,transparent 6px 14px)}
.L .vent{left:1370px;top:110px} .P .vent{left:800px;top:150px}
.eyes{position:absolute;left:38px;top:30px;width:56px;height:8px;opacity:0;animation:eyes 23s infinite}
.eyes::before,.eyes::after{content:"";position:absolute;top:0;width:8px;height:6px;border-radius:50%;background:#ffefc8;box-shadow:0 0 8px #ffd27a}
.eyes::after{right:0}
@keyframes eyes{0%,88%,93%,100%{opacity:0}89%,92%{opacity:.9}}
.chair{width:130px;height:230px}
.L .chair{left:1320px;top:380px} .P .chair{left:790px;top:760px}
.chair .back{position:absolute;left:14px;top:0;width:100px;height:120px;border:10px solid #3e2a1a;border-bottom:0;background:repeating-linear-gradient(90deg,transparent 0 20px,#3e2a1a 20px 30px)}
.chair .seat{position:absolute;left:4px;top:120px;width:122px;height:18px;background:linear-gradient(#5a3e26,#2e1f12)}
.chair .leg{position:absolute;top:138px;width:10px;height:92px;background:#2e1f12}
.chair .jacket{position:absolute;left:4px;top:-4px;width:110px;height:120px;border-radius:30px 30px 10px 40px;background:radial-gradient(ellipse at 40% 30%,#3a3f4a,#15171c 70%);transform:rotate(-6deg)}
.ring{width:260px;height:240px}
.L .ring{left:1450px;top:500px} .P .ring{left:860px;top:900px}
.bucket{width:80px;height:84px;background:linear-gradient(90deg,#3b3f42,#7b8084 50%,#3b3f42);clip-path:polygon(0 0,100% 0,86% 100%,14% 100%)}
.bucket::after{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#1a1c1d}
.L .bucket{left:1630px;top:600px} .P .bucket{left:960px;top:1050px}
.look{position:fixed;z-index:30;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:rgba(20,14,12,.55);border:1px solid #4a3a30;
  color:#cdbfb2;font-size:30px;line-height:1;display:grid;place-items:center;touch-action:none;transition:opacity .2s}
.look:active{background:rgba(60,40,30,.8)}
.look.l{left:max(16px,env(safe-area-inset-left,0px))} .look.r{right:max(16px,env(safe-area-inset-right,0px))}
.look.off{opacity:0;pointer-events:none}

/* ---------- book in the room ---------- */
.bookprop{position:absolute;z-index:6;width:150px;height:100px;cursor:pointer;background:none;padding:0;transform:rotate(-8deg)}
.L .bookprop{left:960px;top:650px} .P .bookprop{left:470px;top:1110px}
.bookprop .cv{position:absolute;inset:0;border-radius:4px 8px 8px 4px;background:radial-gradient(ellipse at 30% 30%,#6a2a1c,#3a120a 70%);box-shadow:0 10px 16px rgba(0,0,0,.8),inset 6px 0 0 #2a0c06}
.bookprop .cv::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--noise);mix-blend-mode:multiply;opacity:.6}
.bookprop .edge{position:absolute;left:8px;right:-4px;bottom:-6px;height:8px;background:repeating-linear-gradient(90deg,#e8dcc0 0 2px,#bfae8a 2px 3px);border-radius:0 0 4px 4px}
.bookprop .ttl{position:absolute;left:0;right:0;top:34px;text-align:center;font-family:var(--f-hand);color:#c89a4a;font-size:22px;text-shadow:0 1px 0 #000}
.bookprop:hover .cv{filter:brightness(1.25)}
/* wall clock */
.clock{position:absolute;z-index:3;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#efe4cf 0 60%,#cdbd9a 61% 64%,#2a2420 65%);box-shadow:0 6px 12px rgba(0,0,0,.7)}
.L .clock{left:1040px;top:20px} .P .clock{left:600px;top:190px}
.clock::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--noise);mix-blend-mode:multiply;opacity:.45}
.clock .num{position:absolute;font-family:var(--f-body);font-weight:700;font-size:11px;color:#2a2018;transform:translate(-50%,-50%)}
.clock .hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:#1a1410;border-radius:3px}
.clock .hh{width:5px;height:22px;margin-left:-2.5px} .clock .mh{width:3px;height:32px;margin-left:-1.5px}
.clock .pin{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#7a1a10}
.clock.late{box-shadow:0 0 22px rgba(227,68,58,.7),0 6px 12px rgba(0,0,0,.7)}
.clock.stopped .pin{background:#555}

/* ---------- book overlay ---------- */
.bookov{position:fixed;inset:0;z-index:45;background:rgba(5,3,4,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.book{position:relative;width:min(980px,100%,calc((100vh - 120px) * 1.45));aspect-ratio:1.45;perspective:2000px;background:radial-gradient(ellipse at 30% 20%,#5a2216,#2a0c06);padding:14px;border-radius:10px;box-shadow:0 30px 60px #000}
.book.single{width:min(500px,100%,calc((100vh - 120px) * .74));aspect-ratio:.74}
.pages{position:absolute;inset:14px;display:flex;transform-style:preserve-3d}
.page,.face{background:linear-gradient(90deg,#e6d9bc,#efe5cf 15%,#efe5cf 85%,#ddcfae);color:#2a2018;font-family:var(--f-hand);font-size:21px;line-height:1.25;padding:26px 28px;overflow:hidden;position:relative}
.page::after,.face::after{content:"";position:absolute;inset:0;background:var(--noise);mix-blend-mode:multiply;opacity:.35;pointer-events:none}
.page{flex:1;min-width:0;touch-action:pan-y}
.page.left{box-shadow:inset -24px 0 30px -22px rgba(0,0,0,.55)} .page.right{box-shadow:inset 24px 0 30px -22px rgba(0,0,0,.55)}
.book.single .page.left{display:none}
.book.single .page.right{box-shadow:inset 14px 0 20px -14px rgba(0,0,0,.5)}
.leaf{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;z-index:5;pointer-events:none}
.leaf.fwd{right:0;transform-origin:0 50%} .leaf.back{left:0;transform-origin:100% 50%}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.bf{transform:rotateY(180deg)}
.pg h3{font-size:34px;margin:0 0 10px;color:#5a1810;font-weight:600;line-height:1}
.pg p{margin:0 0 10px}
.pg .num{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:16px;color:#7a6448}
.pg .crossed{text-decoration:line-through;color:#7a6448}
.pg .stuck{color:#8a7458;font-style:italic}
.pg .blood{color:#6a1a10}
.pg label{display:flex;flex-direction:column;gap:2px;margin:6px 0 14px}
.pg input[type=range]{width:100%;accent-color:#7a1a10;height:28px}
.pg .opt{flex-direction:row;align-items:center;gap:10px;margin:4px 0;cursor:pointer}
.pg input[type=checkbox],.pg input[type=radio]{width:22px;height:22px;accent-color:#7a1a10}
.pg .pt{display:grid;grid-template-columns:auto 1fr auto;gap:0 12px;align-items:center}
.pg .pt .e{font-size:22px;text-align:center}
.pg ul{margin:0;padding-left:18px}
.bknav{display:flex;gap:12px;align-items:center}
.bknav button{min-width:52px;height:52px;border-radius:26px;background:#2a1f1b;border:1px solid #4a3a30;font-size:22px;color:var(--text);padding:0 16px}
.bknav button:disabled{opacity:.3}
.bknav span{font-family:var(--f-hand);font-size:20px;color:#cdbfb2;min-width:90px;text-align:center}
html.calm .cine::before,html.calm .eyes,html.calm .cam .led{animation:none}

/* ---------- cabinet ---------- */
.rig{position:absolute;display:flex;z-index:5}
.L .rig{left:430px;top:16px} .P .rig{left:90px;top:150px}
.cabinet{position:relative;border-radius:26px 26px 12px 12px;padding:12px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;cursor:grab;
  background:
    radial-gradient(ellipse at 15% 85%,rgba(120,60,20,.55),transparent 30%),
    radial-gradient(ellipse at 90% 30%,rgba(110,55,20,.45),transparent 25%),
    repeating-linear-gradient(103deg,transparent 0 37px,rgba(255,255,255,.035) 37px 38px,transparent 38px 90px),
    linear-gradient(90deg,#2a0d13,#5a1c27 14%,#4a1520 50%,#5a1c27 86%,#2a0d13);
  box-shadow:inset 0 0 0 3px #150509,inset 0 0 50px rgba(0,0,0,.65),0 30px 50px rgba(0,0,0,.8)}
.L .cabinet{width:420px} .P .cabinet{width:460px}
.cabinet::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--noise);mix-blend-mode:multiply;opacity:.55;pointer-events:none}
.cabinet>*{position:relative;z-index:1}
.cabinet.grab{cursor:grabbing}
.rig.rattle{animation:rattle .35s}
.rig{transform-origin:50% 100%}
@keyframes rattle{20%{transform:translateX(-10px) rotate(-1.5deg)}40%{transform:translateX(9px) rotate(1.2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.foot{position:absolute;bottom:-14px;width:60px;height:16px;background:#120608;border-radius:0 0 6px 6px}
.tape{position:absolute;z-index:3!important;width:58px;height:17px;background:linear-gradient(#b3ad9f,#8d877a);opacity:.8;transform:rotate(-34deg);left:4px;top:20px;box-shadow:0 1px 2px rgba(0,0,0,.4);clip-path:polygon(3% 0,97% 8%,100% 100%,0 92%)}
.tape.t2{left:auto;right:4px;transform:rotate(34deg)}
.sticker{position:absolute;z-index:3!important;background:#e8c21c;color:#1a1100;font-weight:700;font-size:12px;letter-spacing:.05em;padding:5px 8px 5px 26px;transform:rotate(-7deg);
  clip-path:polygon(0 0,100% 0,100% 72%,88% 100%,0 100%);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.sticker::before{content:"⚡";position:absolute;left:7px;top:3px}
.sticker::after{content:"";position:absolute;inset:0;background:var(--noise);mix-blend-mode:multiply;opacity:.5}
.sticker{left:-10px;bottom:14px}
.scratch{position:absolute;z-index:3!important;right:22px;bottom:96px;opacity:.5}

.marquee{background:#140608;border-radius:14px;padding:6px 8px 7px 14px;text-align:center;border:2px solid var(--gold-dim);position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px}
.marquee>b{grid-column:1;grid-row:1}
.marquee .bulbs{grid-column:1/3}
.dclock{grid-column:2;grid-row:1;background:#040203;border-radius:4px;padding:0 6px;box-shadow:inset 0 2px 4px #000;font-family:var(--f-led);font-size:24px;line-height:1.05;color:var(--led-amb);text-shadow:0 0 6px currentColor}
.dclock.late{color:var(--led-red);animation:blink .5s steps(2) infinite}
.dclock.stopped{color:#5a4a3a;text-shadow:none}
.dclock small{display:block;font-family:var(--f-body);font-size:8px;letter-spacing:.2em;color:#6b5458;line-height:1}
.marquee b{font-family:var(--f-display);font-weight:400;color:var(--gold);font-size:24px;letter-spacing:.06em;text-shadow:0 0 12px rgba(242,179,61,.6)}
.marquee b span{opacity:.25}
.bulbs{display:flex;justify-content:space-between;margin-top:3px}
.bulbs span{width:8px;height:8px;border-radius:50%;background:#4a2e18}
.bulbs span:nth-child(4),.bulbs span:nth-child(9){background:#1a1008}
.cabinet.lit .bulbs span{background:var(--gold);box-shadow:0 0 8px var(--gold);animation:blink .32s steps(2) infinite}
.cabinet.lit .bulbs span:nth-child(odd){animation-delay:.16s}
@keyframes blink{50%{opacity:.2}}

.displays{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#0c0406;border-radius:10px;padding:6px;border:2px solid #2c1015}
.disp{background:#040203;border-radius:5px;padding:2px 8px 0;display:flex;flex-direction:column;box-shadow:inset 0 2px 6px rgba(0,0,0,.9);position:relative;min-width:0;overflow:hidden}
.disp::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.06),transparent 40%),var(--noise);mix-blend-mode:screen;opacity:.35;pointer-events:none}
.disp.wide{grid-column:span 3} .disp.small{grid-column:span 2}
.disp .lbl{font-size:10px;letter-spacing:.18em;color:#6b5458}
.seg{font-family:var(--f-led);font-size:34px;line-height:.95;color:var(--led-grn);text-shadow:0 0 8px currentColor;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg.red{color:var(--led-red)} .seg.amb{color:var(--led-amb)}
.seg i{font-style:normal;opacity:.15}
.meter{grid-column:span 6;height:12px;background:#040203;border-radius:4px;position:relative;overflow:hidden;box-shadow:inset 0 1px 3px #000}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,var(--led-amb) 0 6px,transparent 6px 8px);box-shadow:0 0 8px var(--led-amb);transition:width .4s}
.meter span{position:absolute;right:6px;top:-3px;font-family:var(--f-led);font-size:15px;color:#9c7a3a}
.pop{position:absolute;right:8px;top:2px;font-family:var(--f-led);font-size:24px;color:var(--led-grn);opacity:0;pointer-events:none;text-shadow:0 0 8px currentColor}
.pop.show{animation:pop 1.1s ease-out} .pop.neg{color:var(--led-red)}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}

.window{background:#0b0509;border-radius:12px;padding:7px;position:relative;box-shadow:inset 0 4px 14px rgba(0,0,0,.9);border:4px solid #6e6670}
.window::after{content:"";position:absolute;inset:0;border-radius:8px;pointer-events:none;z-index:2;
  background:linear-gradient(115deg,rgba(255,255,255,.08) 0 18%,transparent 19% 60%,rgba(255,255,255,.04) 61% 66%,transparent 67%),
  radial-gradient(ellipse at 20% 90%,rgba(90,70,40,.35),transparent 40%),radial-gradient(ellipse at 85% 10%,rgba(90,70,40,.3),transparent 35%)}
.glasscrack{position:absolute;right:8px;top:8px;z-index:3;pointer-events:none;opacity:.7}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.reel{aspect-ratio:1/2.4;max-width:100%;overflow:hidden;border-radius:5px;position:relative;background:linear-gradient(#a99a85,#efe5d4 30%,#efe5d4 70%,#a99a85)}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.55),transparent 22%,transparent 78%,rgba(0,0,0,.55))}
.strip{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;will-change:transform}
.strip.blur{filter:blur(2.5px)}
.sym{flex:1 1 0;display:grid;place-items:center;font-size:56px;line-height:1;user-select:none;position:relative}
.P .sym{font-size:62px}
.L .reel{aspect-ratio:1/2.15} .L .cabinet{gap:6px}
.sym.win::before{content:"";position:absolute;inset:6%;border-radius:8px;box-shadow:0 0 0 3px var(--win),0 0 18px var(--win);background:rgba(95,211,141,.15)}
.sym.cursed::before{content:"";position:absolute;inset:6%;border-radius:8px;box-shadow:0 0 0 3px var(--red),0 0 18px var(--red)}
.seven{font-family:var(--f-display);color:#c4231b;font-size:.95em;text-shadow:0 3px 0 #6b120d}

.msg{height:44px;overflow:hidden;text-align:center;font-family:var(--f-led);font-size:21px;line-height:.95;display:flex;align-items:center;justify-content:center;padding:3px 8px;
  background:#040203;border-radius:6px;color:var(--led-amb);text-shadow:0 0 6px currentColor;border:1px solid #2c1015;text-wrap:balance}
.msg.good{color:var(--led-grn)} .msg.bad{color:var(--led-red)}

.panel{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:linear-gradient(#24090f,#140508);border-radius:10px;padding:8px 10px;border:1px solid #3b1820}
.slotbox{display:flex;flex-direction:column;align-items:center;gap:5px}
.coinslot{width:58px;height:58px;border-radius:10px;background:radial-gradient(circle at 50% 40%,#b8b0ba,#5d5462);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),0 3px 0 #0a0204;position:relative;transition:transform .12s,box-shadow .12s}
.coinslot::before{content:"";width:8px;height:38px;border-radius:4px;background:#0a0204;box-shadow:inset 0 0 0 1px #000}
.coinslot::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 70% 80%,rgba(90,50,20,.55),transparent 50%)}
.coinslot.hot{box-shadow:0 0 0 3px var(--gold),0 0 20px var(--gold);transform:scale(1.06)}
.coinslot.gulp{animation:gulp .25s}
@keyframes gulp{50%{transform:scale(.93)}}
.leds{display:flex;gap:4px}
.leds i{width:11px;height:11px;border-radius:50%;background:#3c1a1f;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.leds i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.tinylbl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#7c6468}
.gamble{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.gamble .row{display:flex;gap:10px;align-items:center}
.card{width:40px;height:56px;border-radius:5px;background:#efe5d4;color:#111;display:grid;place-items:center;font-size:19px;font-weight:700;transition:transform .2s}
.card.r{color:#c4231b} .card.back{background:repeating-linear-gradient(45deg,#6d1714 0 6px,#4a0f0d 6px 12px);color:transparent}
.card.flip{transform:rotateY(90deg)}
.pbtn{width:52px;height:52px;border-radius:50%;font-weight:700;font-size:11px;line-height:1.1;display:grid;place-items:center;
  box-shadow:0 5px 0 rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.2);transition:transform .08s,box-shadow .08s}
.pbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.7)}
.pbtn.red{background:radial-gradient(circle at 40% 30%,#e86a5c,#8f1a14)} .pbtn.black{background:radial-gradient(circle at 40% 30%,#4a3f4e,#120d13)}
.pbtn:disabled{filter:brightness(.45) saturate(.6)}
.endbtn{width:62px;height:62px;font-size:11px;background:radial-gradient(circle at 40% 30%,#f0d27a,#a8741a);color:#2a1405}
.endbtn.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 5px 0 rgba(0,0,0,.6),0 0 24px var(--gold)}}

.tray{height:74px;border-radius:0 0 12px 12px;background:linear-gradient(#0a0306,#1c0d12);border:4px solid #6e6670;border-top-width:7px;position:relative;overflow:hidden;cursor:pointer;
  box-shadow:inset 0 8px 16px rgba(0,0,0,.9)}
.tray::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 100%,rgba(90,60,30,.4),transparent 50%);pointer-events:none}
.tray .lbl{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7c6468;pointer-events:none;z-index:2}
.tray.full .lbl{color:var(--gold)}
.tray .amt{position:absolute;right:10px;top:4px;font-family:var(--f-led);color:var(--led-amb);font-size:24px;pointer-events:none;z-index:2;text-shadow:0 0 6px currentColor}
.coin{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1b8,#e0a63a 45%,#8e5c14);border:2px solid #6a420c;
  display:grid;place-items:center;font-family:var(--f-display);font-size:13px;color:#6a420c;box-shadow:0 2px 0 #4a2e06}
.tray .coin{position:absolute;animation:drop .5s cubic-bezier(.4,1.6,.6,1) both}
@keyframes drop{from{transform:translateY(-90px)}to{transform:translateY(0)}}
.flycoin{position:fixed;z-index:60;pointer-events:none;margin:-15px 0 0 -15px}

.lever{width:64px;flex:none;position:relative;height:300px;margin-left:-4px;touch-action:none}
.L .lever{margin-top:300px} .P .lever{margin-top:330px}
.lever .mount{position:absolute;left:0;top:118px;width:32px;height:64px;border-radius:0 12px 12px 0;background:linear-gradient(90deg,#5d5560,#b9b2bc 50%,#5d5560);box-shadow:0 4px 8px rgba(0,0,0,.6)}
.lever .mount::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 30% 70%,rgba(120,60,20,.7),transparent 60%)}
.lever .rod{position:absolute;left:24px;width:10px;top:30px;height:120px;transform-origin:50% 100%;border-radius:5px;background:linear-gradient(90deg,#5d5560,#cfc8d2,#5d5560)}
.lever .knob{position:absolute;left:5px;width:50px;height:50px;border-radius:50%;margin-top:-25px;background:radial-gradient(circle at 35% 30%,#ff8b7d,#c2271d 50%,#5e0d08);
  box-shadow:0 6px 12px rgba(0,0,0,.7);cursor:grab;touch-action:none}
.lever .knob::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 70% 75%,rgba(40,10,5,.6),transparent 50%)}
.lever .knob:active{cursor:grabbing}

.desk{position:absolute;z-index:6;touch-action:none}
.purse{position:absolute;z-index:6;touch-action:none;cursor:grab;width:150px;height:130px}
.L .purse{left:240px;top:368px} .P .purse{left:170px;top:1040px}
.table{position:absolute;z-index:5;pointer-events:none}
.L .table{left:40px;top:418px;width:380px;height:270px} .P .table{left:-10px;top:1092px;width:360px;height:200px}
.table .surf{position:absolute;left:0;right:0;top:0;height:92px;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);
  background:var(--noise),repeating-linear-gradient(90deg,rgba(30,15,5,.0) 0 26px,rgba(30,15,5,.28) 26px 28px,rgba(255,220,170,.05) 28px 30px,transparent 30px 58px),linear-gradient(#3a2614,#5e4024 55%,#7a5532);background-blend-mode:multiply,normal,normal}
.table .surf::after{content:"";position:absolute;left:40%;top:30%;width:70px;height:26px;border-radius:50%;border:2px solid rgba(20,10,4,.4)}
.table .shade{position:absolute;left:0;right:0;top:0;height:92px;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);background:linear-gradient(rgba(0,0,0,.45),transparent 60%)}
.table .front{position:absolute;left:0;right:0;top:92px;height:24px;background:linear-gradient(#5a3c20,#2e1d0e);box-shadow:0 14px 20px rgba(0,0,0,.75)}
.table .front::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,220,170,.25)}
.table .tleg{position:absolute;top:116px;width:20px;bottom:0;background:linear-gradient(90deg,#24160a,#4a3018,#24160a)}
.table .tleg.back{top:70px;bottom:auto;height:58%;width:11px;filter:brightness(.45);z-index:-1}
.dphone{position:absolute;z-index:6;width:130px;height:96px;cursor:pointer;background:none;padding:0}
.L .dphone{left:90px;top:400px} .P .dphone{left:28px;top:1080px}
.dphone .base{position:absolute;left:4px;right:4px;bottom:0;height:60px;border-radius:16px 16px 8px 8px;background:radial-gradient(ellipse at 40% 25%,#3a3330,#141110 70%);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);box-shadow:0 8px 12px rgba(0,0,0,.8)}
.dphone .dialp{position:absolute;left:50%;bottom:8px;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:radial-gradient(circle,#d8ccb6 0 26%,#0c0a09 27% 30%,#2a2420 31% 100%);
  box-shadow:inset 0 0 0 3px #0c0a09}
.dphone .dialp::after{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 50% 12%,#0a0808 0 3px,transparent 4px),radial-gradient(circle at 82% 30%,#0a0808 0 3px,transparent 4px),radial-gradient(circle at 88% 66%,#0a0808 0 3px,transparent 4px),radial-gradient(circle at 62% 90%,#0a0808 0 3px,transparent 4px),radial-gradient(circle at 26% 86%,#0a0808 0 3px,transparent 4px),radial-gradient(circle at 12% 52%,#0a0808 0 3px,transparent 4px),radial-gradient(circle at 26% 18%,#0a0808 0 3px,transparent 4px)}
.dphone .hset{position:absolute;left:0;right:0;top:12px;height:26px;transition:transform .35s cubic-bezier(.3,1.4,.5,1);transform-origin:50% 100%}
.dphone .hset i{position:absolute;top:0;width:34px;height:24px;border-radius:12px 12px 6px 6px;background:radial-gradient(ellipse at 40% 30%,#3a3330,#121010 70%)}
.dphone .hset i:first-child{left:0} .dphone .hset i:last-child{right:0}
.dphone .hset b{position:absolute;left:20px;right:20px;top:2px;height:13px;border-radius:7px;background:linear-gradient(#3a3330,#141110)}
.dphone.lift .hset{transform:translate(-6px,-26px) rotate(-14deg)}
.dphone .pcord{position:absolute;right:-26px;bottom:6px;width:34px;height:30px}
.dphone:hover .base{filter:brightness(1.25)}
.purse .sack{position:absolute;left:10px;right:10px;bottom:0;height:96px;border-radius:44% 44% 38% 38% / 30% 30% 62% 62%;
  background:radial-gradient(ellipse at 35% 35%,#8a6038,#5a3a1e 55%,#2e1d0e);box-shadow:0 10px 18px rgba(0,0,0,.8)}
.purse .sack::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--noise);mix-blend-mode:multiply;opacity:.6}
.purse .neck{position:absolute;left:50px;top:26px;width:50px;height:14px;background:#3e2814;border-radius:6px}
.purse .coin{position:absolute;width:34px;height:34px;font-size:14px}
.purse .tag{position:absolute;right:-26px;top:52px;background:#d8c9a6;color:#2a2018;font-family:var(--f-hand);font-size:24px;padding:2px 10px;transform:rotate(9deg);box-shadow:2px 3px 6px rgba(0,0,0,.6);white-space:nowrap}
.purse.empty .coin{display:none}
.purse.locked{cursor:not-allowed}

function weights(){

}

/* ---------- evaluation ---------- */
function evalLine(g,line){
  const syms=line.map(i=>g[i]);
  const base=syms.find(s=>s!=='joker')||'seven';
  if(base==='skull') return null;
  return syms.every(s=>s===base||s==='joker') ? base : null;
}
function evaluate(g,bet){
  const skulls=g.filter(s=>s==='skull').length;
  const lines=[...ROWS.map(l=>({l,t:'row'})),...COLS.map(l=>({l,t:'col'})),...DIAG.map(l=>({l,t:'diag'}))];
  const wins=[];let total=0;
  for(const {l,t} of lines){
    const s=evalLine(g,l);
    if(!s) continue;
    const amt=symValue(s)*(t==='diag'&&has('brille')?2:1)*(t==='col'&&has('saeulen')?2:1)*mult()*bet;
    wins.push({cells:l,sym:s,amt});total+=amt;
  }
  const base=g.find(s=>s!=='joker')||'seven';
  const jackpot = base!=='skull' && g.every(s=>s===base||s==='joker');
  if(jackpot) total*=10;
  const curse = skulls>=3;
  return {total:curse?0:total,wins,curse,jackpot};
}

    const fill=Array.from({length:16+c*7},()=>SYMS[roll(w)].e);

      if(overSlotXY(e.clientX,e.clientY)){const r=$('slot').getBoundingClientRect();
        a.fc.animate([{left:a.fc.style.left,top:a.fc.style.top,transform:'scale(1)'},{left:(r.left+r.width/2)+'px',top:(r.top+r.height/2)+'px',transform:'scale(.2) rotateY(80deg)'}],{duration:160}).onfinish=()=>{a.fc.remove();done();};
      }else{const t=bowlScreenPoint();
        a.fc.animate([{left:a.fc.style.left,top:a.fc.style.top},{left:t.x+'px',top:t.y+'px'}],{duration:240,easing:'ease-in'}).onfinish=()=>{a.fc.remove();coinHeld=0;coinArriving++;coinArrive();};}
    }else if(a.type==='hand'){
      hs.grab=null;
      if(nearCradle()) snapToCradle();
    }else if(a.type==='dial'){
      dial.drag=null;dial.digit=dial.rot>=maxRot(a.k)-.08?(a.k+1)%10:null;
      dial.pulses=dial.digit===null?0:(dial.digit||10);
      if(dial.digit!==null&&hs.on){setMsg('ERST DEN HÖRER ABNEHMEN');}

})();
function nearCradle(){
  const cr=cradle(),mx=(cr.a.x+cr.b.x)/2,my=(cr.a.y+cr.b.y)/2;
  // any part of the handset close to the cradle counts
  return [hs.a,hs.b,{x:(hs.a.x+hs.b.x)/2,y:(hs.a.y+hs.b.y)/2}].some(p=>Math.hypot(p.x-mx,p.y-my)<75);
}
function snapToCradle(){
  // glide the handset onto the cradle, then click it in
  const cr=cradle(),fa={...hs.a},fb={...hs.b},t0=performance.now(),dur=reduce?1:180;
  hs.snapping=true;
  const st=n=>{const k=Math.min(1,(n-t0)/dur),e=k*k*(3-2*k);
    hs.a.x=fa.x+(cr.a.x-fa.x)*e;hs.a.y=fa.y+(cr.a.y-fa.y)*e;hs.b.x=fb.x+(cr.b.x-fb.x)*e;hs.b.y=fb.y+(cr.b.y-fb.y)*e;
    hs.pa={...hs.a};hs.pb={...hs.b};
    if(k<1)requestAnimationFrame(st);else{hs.snapping=false;hangUp(false);}};
  requestAnimationFrame(st);
}
function overSlotXY(x,y){const r=$('slot').getBoundingClientRect(),p=30;return x>r.left-p&&x<r.right+p&&y>r.top-p&&y<r.bottom+p;}

/* ---------- lever ---------- */
const LEV={t:0,pulled:false,anim:0};
const PIVOT=150, ROD_LEN=120;
function setLever(t){
  LEV.t=t;
  const sy=1-1.8*t;
  $('rod').style.transform=`scaleY(${sy})`;
  $('knob').style.top=(PIVOT-ROD_LEN*sy)+'px';
}
function springBack(){
  cancelAnimationFrame(LEV.anim);
  const start=LEV.t, t0=performance.now(), dur=reduce?1:520;
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur);
    const e=1-Math.pow(1-k,3);
    const wob=Math.sin(k*Math.PI*3)*(1-k)*0.06;
    setLever(Math.max(0,start*(1-e)-wob));
    if(k<1) LEV.anim=requestAnimationFrame(step); else setLever(0);
  };
  LEV.anim=requestAnimationFrame(step);
}
function leverTriggered(){
  thunk();
  if(S.spinning||S.shaking) return;
  if(S.spinsLeft<=0){setMsg('KEINE DREHS · TAG ENDE DRÜCKEN','bad');return;}
  if(S.credits<=0){setMsg('ERST MÜNZE EINWERFEN','bad');beep(120,.2,'sawtooth',.04);return;}
  spin();
}
(function leverDrag(){
  const knob=$('knob');let drag=null,lastTick=0;
  knob.addEventListener('pointerdown',e=>{
    if(!uiFree()) return;
    e.preventDefault();knob.setPointerCapture(e.pointerId);cancelAnimationFrame(LEV.anim);
    drag={y:e.clientY,t:LEV.t};LEV.pulled=false;lastTick=0;
  });
  knob.addEventListener('pointermove',e=>{
    if(!drag) return;
    const t=Math.max(0,Math.min(1,drag.t+(e.clientY-drag.y)/(ROD_LEN*1.8*SCALE)));
    setLever(t);
    const tick=Math.floor(t*7);if(tick>lastTick){beep(500+tick*40,.02,'square',.025);lastTick=tick;}
    if(t>=.92&&!LEV.pulled){LEV.pulled=true;leverTriggered();}
  });
  const end=()=>{if(!drag)return;drag=null;springBack();};
  knob.addEventListener('pointerup',end);knob.addEventListener('pointercancel',end);
  knob.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();autoPull();}});
})();
function autoPull(){
  if(!uiFree()||S.spinning||S.shaking) return;
  cancelAnimationFrame(LEV.anim);
  const t0=performance.now(),dur=reduce?1:220;LEV.pulled=false;
  const step=now=>{const k=Math.min(1,(now-t0)/dur);setLever(k);
    if(k<1)LEV.anim=requestAnimationFrame(step);else{leverTriggered();springBack();}};
  LEV.anim=requestAnimationFrame(step);
}

function freshState(){

}
function newGame(){
  dying=false;
  S=freshState();S.started=true;if(D){coins.length=0;coinArriving=0;settleCoins(S.money);}
  const w=weights();S.grid=Array.from({length:9},()=>roll(w));

function startDay(){S.spinsLeft=spinsPerDay();S.shakesToday=0;S.loanToday=false;S.time=0;}

function resetCard(){$('card').className='card back';$('card').textContent='?';}

async function spin(){
  if(S.pending) collect();
  S.spinning=true;S.spinsLeft--;S.spinsTotal++;
  const bet=S.credits;S.bet=bet;S.lastBet=bet;S.credits=0;
  clearMarks();resetCard();render();setMsg('. . .');
  const w=weights();
  const final=Array.from({length:9},()=>roll(w));
  await Promise.all([0,1,2].map(c=>spinReel(c,[final[c],final[c+3],final[c+6]],reduce?1:1100+c*420).then(()=>{if(!reduce)thunk();})));
  S.grid=final;
  [0,1,2].forEach(restStrip);
  resolve(bet);
}

function resolve(bet,fromShake){
  S.spinning=false;
  const r=evaluate(S.grid,bet);
  if(r.curse){
    S.grid.forEach((s,i)=>{if(s==='skull')symEl(i).classList.add('cursed');});
    setMsg('FLUCH · 3 SCHÄDEL · NICHTS','bad');
    melody([200,150,110],120,'sawtooth');
    if(!fromShake) trost(bet);
    S.lastBet=0;render();return;
  }
  if(r.total>0){
    S.lastBet=0;
    r.wins.forEach(w=>w.cells.forEach(i=>symEl(i).classList.add('win')));
    $('cab').classList.add('lit');
    S.pending=r.total;S.doubles=0;
    const n=r.wins.length;
    setMsg(r.jackpot?`JACKPOT · ${fmt(r.total)}`:`${n} ${n===1?'LINIE':'LINIEN'} · +${fmt(r.total)}`,'good');
    pourCoins(r.total);
    if(r.jackpot) celebrate(r.total);
    melody(r.jackpot?[523,659,784,1046,1318]:[523,784],r.jackpot?110:80);
  }else{
    if(fromShake) setMsg('GERÜTTELT · IMMER NOCH NICHTS');
    else setMsg(S.spinsLeft?'NICHTS · RÜTTELN ODER NEU':'NICHTS · RÜTTELN ODER TAG ENDE');
    beep(140,.15,'sawtooth',.03);
    if(!fromShake) trost(bet);
  }
  render();
}

function clearTray(){$('tray').querySelectorAll('.coin').forEach(c=>c.remove());}
function pourCoins(amount){
  clearTray();
  const tray=$('tray'),n=Math.min(28,Math.max(3,Math.round(Math.sqrt(amount)*2.2)));
  const W=tray.clientWidth-36;
  for(let i=0;i<n;i++){

function collect(){
  if(!S.pending) return;
  const amt=S.pending;
  // measure the coins in the tray BEFORE removing them, so they fly from the machine to the purse
  const bp=bowlScreenPoint(),target={left:bp.x-6,top:bp.y-6,width:12,height:12};
  const rects=[...$('tray').querySelectorAll('.coin')].slice(0,12).map(c=>c.getBoundingClientRect());
  clearTray();
  const room=Math.max(0,Math.min(CAP,S.money+amt)-coins.length-coinArriving);
  const n=Math.min(rects.length,room);coinArriving+=n;
  rects.forEach((r,i)=>flyCoin(r,target,i<n?coinArrive:null,i*55));
  S.money+=amt;S.won+=amt;popMoney(amt);S.pending=0;S.doubles=0;
  melody([660,880],70);setMsg(`+${fmt(amt)} EINGESTECKT`,'good');resetCard();clearMarks();render();
}

function gamble(color){
  if(!S.pending||S.doubles>=3||S.spinning) return;
  const p=has('zocker')?0.6:0.5;
  const ok=Math.random()<p;
  const shown=ok?color:(color==='r'?'b':'r');
  const ranks=['A','K','D','B','10','9','7'];
  const card=$('card');
  card.classList.add('flip');beep(700,.04,'triangle',.03);
  setTimeout(()=>{
    card.className='card'+(shown==='r'?' r':'');
    card.textContent=(shown==='r'?'♥':'♠')+ranks[Math.floor(Math.random()*ranks.length)];
    if(ok){S.pending*=2;S.doubles++;setMsg(`RICHTIG · ${fmt(S.pending)} IN DER SCHALE`,'good');pourCoins(S.pending);melody([700,900,1100],60);}
    else{setMsg('FALSCH · SCHALE LEER','bad');S.pending=0;S.doubles=0;clearTray();clearMarks();melody([300,200],120,'sawtooth');}
    render();
  },reduce?0:200);
}

function endDay(){
  if((S.spinsLeft>0&&!broke())||S.spinning||S.shaking||S.credits>0) return;
  if(S.pending) collect();
  let interest=0;
  if(has('schwein')){interest=Math.floor(S.money*0.15);S.money+=interest;}
  if(S.day>=DAYS){payday(interest);return;}
  S.day++;
  openShop(`Tag ${S.day-1} vorbei`, interest?`Sparschwein: +${fmt(interest)} Zinsen. `:'');
  render();
}

}

    vf.type='bandpass';vf.frequency.value=900;vf.Q.value=8;
    vg.gain.setValueAtTime(0,t0);vg.gain.linearRampToValueAtTime(.05*vol,t0+.12);vg.gain.linearRampToValueAtTime(0,t0+dur);

    lfo.connect(lg).connect(gb.gain);b.connect(fb).connect(gb).connect(out);
    b.start(t0+.2);lfo.start(t0+.2);lfo.stop(t0+dur+.6);

  }catch(e){}
}

let gaspBuf=null,gaspLoading=false;
function loadGasp(){
  if(gaspBuf||gaspLoading||!AC) return;gaspLoading=true;
  try{const bin=atob(GASP_MP3),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    AC.decodeAudioData(u.buffer,b=>{gaspBuf=b;},()=>{gaspLoading=false;});}catch(e){gaspLoading=false;}
}
function playGaspFile(){
  if(!gaspBuf||muted||SET.sfx<=0||!AC) return null;
  const src=AC.createBufferSource(),g=AC.createGain();src.buffer=gaspBuf;g.gain.value=.38*SET.sfx;
  src.connect(g).connect(AC.destination);src.start();
  return {stop(){try{g.gain.setValueAtTime(0,AC.currentTime);src.stop();}catch(e){}}};
}
function thud(){beep(48,.3,'sine',.25);beep(90,.12,'square',.08);}
let bulbDead=false;
function crackle(){if(muted||SET.sfx<=0||!AC)return;try{const n=noiseNode(.04+Math.random()*.05,x=>1-x),f=AC.createBiquadFilter(),g=AC.createGain();f.type='highpass';f.frequency.value=2500;g.gain.value=.25*SET.sfx;n.connect(f).connect(g).connect(AC.destination);n.start();}catch(e){}}
function glassPop(){if(muted||SET.sfx<=0||!AC)return;try{
  const n=noiseNode(.5,x=>Math.pow(1-x,3)),f=AC.createBiquadFilter(),g=AC.createGain();f.type='highpass';f.frequency.value=3500;g.gain.value=.5*SET.sfx;n.connect(f).connect(g).connect(AC.destination);n.start();
  for(let i=0;i<10;i++){const t=AC.currentTime+.05+Math.random()*.6,o=AC.createOscillator(),og=AC.createGain();o.type='triangle';o.frequency.value=3000+Math.random()*3000;og.gain.setValueAtTime(.04*SET.sfx,t);og.gain.exponentialRampToValueAtTime(.0001,t+.08);o.connect(og).connect(AC.destination);o.start(t);o.stop(t+.1);}
  beep(60,.4,'sine',.2);}catch(e){}}
function electroDeath(){
  dying=true;stopHiss();
  S.started=false;clearSave();S.spinning=true;loanBusy=true;
  const calm=reduce||SET.calm, stage=$('stage'), cab=$('cab');
  if(drone) drone.gain.value=0;
  // rising mains hum with tremolo
  let hum=null;
  try{if(!muted&&SET.sfx>0&&AC){
    const g=AC.createGain();g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.16*SET.sfx,AC.currentTime+3.4);
    const trem=AC.createGain();trem.gain.value=1;const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=7;lg.gain.value=.5;lfo.connect(lg).connect(trem.gain);
    const os=[[50,'sawtooth'],[100,'square'],[150,'sawtooth']].map(([f,t])=>{const o=AC.createOscillator();o.type=t;o.frequency.setValueAtTime(f,AC.currentTime);o.frequency.linearRampToValueAtTime(f*1.6,AC.currentTime+3.6);o.connect(trem);o.start();return o;});
    const sing=AC.createOscillator(),sg=AC.createGain();sing.type='sine';sing.frequency.setValueAtTime(900,AC.currentTime);sing.frequency.exponentialRampToValueAtTime(3400,AC.currentTime+3.6);sg.gain.setValueAtTime(.0001,AC.currentTime);sg.gain.exponentialRampToValueAtTime(.05*SET.sfx,AC.currentTime+3.4);sing.connect(sg).connect(AC.destination);sing.start();
    trem.connect(g).connect(AC.destination);lfo.start();
    hum={stop(){try{g.gain.cancelScheduledValues(AC.currentTime);g.gain.setValueAtTime(0,AC.currentTime);sg.gain.cancelScheduledValues(AC.currentTime);sg.gain.setValueAtTime(0,AC.currentTime);os.forEach(o=>o.stop());lfo.stop();sing.stop();}catch(e){}}};
  }}catch(e){}
  if(!calm){stage.classList.add('electro');$('rig').classList.add('electro');}
  setMsg('▒▒▒▒▒▒▒▒▒▒▒▒','bad');
  const glyph='0123456789#%&?!';
  const scr=()=>Array.from({length:3},()=>glyph[Math.floor(Math.random()*glyph.length)]).join('');
  const iv=setInterval(()=>{
    // garbled readouts, reels twitching by themselves, sparks, lever jerks
    ['dDebt','dMoney','dSpins','dClockT'].forEach(id=>$(id).textContent=scr());
    [0,1,2].forEach(c=>{const st=$('s'+c);[...st.children].forEach(el=>{if(Math.random()<.5)el.innerHTML=SYMS[roll()].e;});});
    setLever(Math.random()*.35);
    if(Math.random()<.7){const sp=document.createElement('div');sp.className='spark';
      const side=Math.random();sp.style.height=(14+Math.random()*30)+'px';
      sp.style.left=(side<.5?Math.random()*12:88+Math.random()*12)+'%';sp.style.top=(Math.random()*90)+'%';
      sp.style.setProperty('--r',`rotate(${Math.random()*360}deg)`);sp.style.transform=`rotate(${Math.random()*360}deg)`;
      cab.appendChild(sp);setTimeout(()=>sp.remove(),200);crackle();}
    flickerUntil=performance.now()+120;
  },calm?260:70);
  const beats=[300,750,1100,1350,1550,1700,1830,1950,2050,2400,3000];
  beats.forEach(t=>setTimeout(()=>beep(55,.12,'sine',.18),t));
  setTimeout(()=>{
    // the bulb bursts, everything goes dark
    clearInterval(iv);if(hum)hum.stop();glassPop();
    bulbDead=true;stage.classList.remove('electro');$('rig').classList.remove('electro');cab.classList.add('deadc');
    ['dDebt','dMoney','dSpins','dClockT'].forEach(id=>$(id).textContent='');setMsg('');
    if(!calm){
      const r=$('bulb').getBoundingClientRect(), sr=stage.getBoundingClientRect();
      for(let i=0;i<14;i++){const sp=document.createElement('div');sp.className='spark fall';
        sp.style.left=((r.left-sr.left)/SCALE+(Math.random()-.5)*30)+'px';sp.style.top=((r.bottom-sr.top)/SCALE-10)+'px';
        sp.style.setProperty('--dx',((Math.random()-.5)*160)+'px');sp.style.animationDelay=(Math.random()*.2)+'s';
        $('world').appendChild(sp);setTimeout(()=>sp.remove(),1700);}
    }
  },3700);
  setTimeout(()=>{
    die('strom',()=>{bulbDead=false;cab.classList.remove('deadc');S.spinning=false;loanBusy=false;applySet();[0,1,2].forEach(restStrip);setLever(0);render();});
  },5600);
}
function shoot(){
  dying=true;stopHiss();
  loanBusy=true;S.started=false;clearSave();
  const d=$('door');
  setMsg('»ICH HAB DICH GEWARNT.«','bad');
  shadow('come');d.classList.remove('peek');d.classList.add('aim');scrape();
  if(drone) drone.gain.value=0;
  setTimeout(()=>{
    bang();
    const f=document.createElement('div');f.className='shotflash';if(SET.calm)f.style.opacity='.4';document.body.appendChild(f);setTimeout(()=>f.remove(),600);
    if(!reduce&&!SET.calm)$('stage').animate([{translate:'0 0'},{translate:'-14px 8px'},{translate:'12px -6px'},{translate:'-6px 4px'},{translate:'0 0'}],{duration:380});
    const calm=reduce||SET.calm;
    const world=$('world'),ceil=$('ceiling'),stage=$('stage');
    const wf=world.animate([{transform:`translateX(${-cam}px)`},{transform:`translateX(${-cam}px) translateY(85%) rotate(-9deg)`}],{duration:calm?10:950,easing:'cubic-bezier(.5,0,.9,.6)',fill:'forwards'});
    const cf=ceil.animate([{transform:'translateY(-110%) rotate(7deg)'},{transform:'translateY(0) rotate(-3deg)'}],{duration:calm?10:950,easing:'cubic-bezier(.5,0,.9,.6)',fill:'forwards'});
    setTimeout(()=>{thud();if(!calm)stage.animate([{translate:'0 0'},{translate:'0 10px'},{translate:'0 -4px'},{translate:'0 0'}],{duration:260});},calm?20:950);
    const bl=document.createElement('div');bl.className='bleed';document.body.appendChild(bl);
    setTimeout(()=>{bl.classList.add('on');ceil.style.filter='blur(3px) saturate(.6)';},1000);
    let beatGap=700,beats=0,alive=true,amp=0;
    const beat=()=>{if(!alive)return;beats++;const v=Math.min(.32,.12+beats*.012);
      beep(55,.16,'sine',v);setTimeout(()=>beep(46,.12,'sine',v*.8),150);
      beatGap=Math.max(230,beatGap*.9);setTimeout(beat,beatGap);};
    setTimeout(beat,1100);
    let breath=null;
    setTimeout(()=>{breath=playGaspFile();
      if(!breath)[0,1400,2600,3600,4600,5600,6600].forEach((t,i)=>setTimeout(()=>{if(alive)gasp(1-i*.1);},t));},1050);
    const tremble=calm?null:setInterval(()=>{amp=Math.min(7,amp+.12);stage.style.translate=`${(Math.random()-.5)*amp}px ${(Math.random()-.5)*amp}px`;},45);
    setTimeout(()=>{bl.classList.add('black');alive=false;if(breath)breath.stop();if(tremble)clearInterval(tremble);stage.style.translate='';},8900);
    setTimeout(()=>{d.classList.remove('aim');loanBusy=false;anger=0;applySet();
      die('schuss',()=>{bl.remove();wf.cancel();cf.cancel();ceil.style.filter='';world.style.transform=`translateX(${-cam}px)`;});},10300);
  },reduce?200:1300);
}
function openLoan(){

  stepSound(2);shadow('come');
  setTimeout(()=>{$('door').classList.add('peek');scrape();},reduce?0:1100);

    openOv(`<h2>Oben in der Tür: zwei Augen.</h2>

const BK={i:0,anim:false};
const perView=()=>innerWidth>=720&&innerWidth>innerHeight*.9?2:1;
function pg(n,P){return P[n]!==undefined?P[n]+`<span class="num">${n+1}</span>`:'';}
function renderBook(){
  const P=bookPages(),pv=perView();
  if(pv===2&&BK.i%2) BK.i--;
  BK.i=Math.max(0,Math.min(BK.i,P.length-1));
  $('book').classList.toggle('single',pv===1);
  $('pgL').innerHTML=pv===2?pg(BK.i,P):'';
  $('pgR').innerHTML=pg(pv===2?BK.i+1:BK.i,P);
  $('bkPrev').disabled=BK.i<=0;
  $('bkNext').disabled=BK.i+pv>=P.length;
  $('bkNum').textContent=pv===2?`${BK.i+1}–${BK.i+2} / ${P.length}`:`${BK.i+1} / ${P.length}`;
  bindBook();
}
function rustle(){
  if(muted||SET.sfx<=0) return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const len=AC.sampleRate*.35,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const src=AC.createBufferSource();src.buffer=buf;
    const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2400;f.Q.value=.7;
    const g=AC.createGain();g.gain.value=.12*SET.sfx;
    src.connect(f).connect(g).connect(AC.destination);src.start();}catch(e){}
}
function flip(dir){
  if(BK.anim) return;
  const P=bookPages(),pv=perView(),ni=BK.i+dir*pv;
  if(ni<0||ni>=P.length) return;
  rustle();
  if(reduce){BK.i=ni;renderBook();return;}
  BK.anim=true;
  const pages=$('book').querySelector('.pages');
  if(pv===2){
    const leaf=document.createElement('div');leaf.className='leaf '+(dir>0?'fwd':'back');
    if(dir>0){
      leaf.innerHTML=`<div class="face pg">${pg(BK.i+1,P)}</div><div class="face bf pg">${pg(ni,P)}</div>`;
      $('pgR').innerHTML=pg(ni+1,P);
    }else{
      leaf.innerHTML=`<div class="face pg">${pg(BK.i,P)}</div><div class="face bf pg">${pg(ni+1,P)}</div>`;
      $('pgL').innerHTML=pg(ni,P);
    }
    pages.appendChild(leaf);
    const a=leaf.animate([{transform:'rotateY(0deg)'},{transform:`rotateY(${dir>0?-180:180}deg)`}],{duration:650,easing:'cubic-bezier(.45,.05,.3,1)'});
    a.onfinish=()=>{leaf.remove();BK.i=ni;BK.anim=false;renderBook();};
  }else{
    const r=$('pgR');
    r.style.transformOrigin=dir>0?'0 50%':'100% 50%';
    const a=r.animate([{transform:'rotateY(0)'},{transform:`rotateY(${dir>0?-90:90}deg)`}],{duration:230,easing:'ease-in'});
    a.onfinish=()=>{BK.i=ni;renderBook();
      const b=r.animate([{transform:`rotateY(${dir>0?90:-90}deg)`},{transform:'rotateY(0)'}],{duration:230,easing:'ease-out'});
      b.onfinish=()=>{BK.anim=false;};};
  }
}
function bindBook(){
  const m=$('setMusic'),x=$('setSfx'),c=$('setCalm');

  if(x){x.oninput=()=>{SET.sfx=+x.value;saveSet();};x.onchange=()=>clink();}

(function bookSwipe(){
  const bk=$('book');let sx=null;

function menuAct(act,el){
  startDrone();
  if(act==='cont'){const sv=loadSave();if(!sv)return showMenu();el.classList.add('drop');thunk();setTimeout(()=>{hideMenu();continueGame(sv);},300);}
  else if(act==='new'){
    if(loadSave()){
      menuPanel(`<h3>Neu anfangen?</h3><p>Dein Spielstand (Level ${loadSave().level}) ist dann weg. Für immer.</p>
        <div class="row2">${menuTag('yes','Ja, neu','','red')}${menuTag('no','Nein','')}</div>`);
    }else{el.classList.add('drop');thunk();setTimeout(startNew,300);}
  }
  else if(act==='yes'){clearSave();$('mpanel').hidden=true;startNew();}
  else if(act==='no'||act==='close'){$('mpanel').hidden=true;}
  else if(act==='book'){openBook();}
  else if(act==='help'){
    menuPanel(`<h3>Steuerung</h3><dl>
      <dt>Münze</dt><dd>Aus der Schüssel in den Schlitz ziehen (1–3)</dd>
      <dt>Hebel</dt><dd>Roten Knauf nach unten reißen</dd>
      <dt>Gewinn</dt><dd>Ausgabeschale antippen · oder Rot/Schwarz riskieren</dd>
      <dt>Rütteln</dt><dd>Gehäuse packen und hin und her reißen. Strom!</dd>
      <dt>Leihen</dt><dd>3× an die Tür klopfen. Nicht öfter.</dd>
      <dt>Umschauen</dt><dd>Pfeile unten · Maus an den Rand</dd>
      <dt>Tagebuch</dt><dd>Liegt auf dem Boden</dd></dl>
      <p class="kbd" style="margin-top:10px">Tasten: M · Leertaste · E · R · ←/→ · B</p>
      <div class="row2">${menuTag('close','Verstanden','')}</div>`);
  }
}
(function wireMenu(){
  const menu=$('menu');
  menu.addEventListener('pointermove',e=>{$('torch').style.setProperty('--tx',e.clientX+'px');$('torch').style.setProperty('--ty',e.clientY+'px');});
  menu.addEventListener('pointerover',e=>{const t=e.target.closest('.mtag');if(!t||t===menu._last)return;menu._last=t;
    t.classList.remove('swing');void t.offsetWidth;t.classList.add('swing');chime();});
  menu.addEventListener('pointerout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('.mtag'))menu._last=null;});
  menu.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;
    t.classList.remove('swing');void t.offsetWidth;t.classList.add('swing');menuAct(t.dataset.act,t);});
  menu.addEventListener('pointerdown',()=>startDrone(),{once:false});
})();

const SAVE_KEY='ld_save_v1';
function saveGame(){
  try{
    if(!S||!S.started) return;
    const {offers,...rest}=S;
    localStorage.setItem(SAVE_KEY,JSON.stringify({...rest,spinning:false,shaking:false,cam}));
  }catch(e){}
}
function loadSave(){try{const t=localStorage.getItem(SAVE_KEY);return t?JSON.parse(t):null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function continueGame(d){
  S={...freshState(),...d,offers:[],spinning:false,shaking:false};if(D){coins.length=0;coinArriving=0;settleCoins(Math.min(CAP,S.money));}
  cam=d.cam||0;fit();
  [0,1,2].forEach(restStrip);closeOv();resetCard();clearTray();
  if(S.pending) pourCoins(S.pending);
  render();
  if(S.inShop) openShop(`Tag ${S.day}`,'');
  else setMsg(taunt(),'bad');
}
function loadBest(){try{return +localStorage.getItem('ld_best')||0}catch(e){return 0}}
function saveBest(){try{if(S.level>loadBest())localStorage.setItem('ld_best',S.level)}catch(e){}}

/* ---------- wiring ---------- */
S=freshState();S.spinsLeft=10;
S.grid=['seven','gem','clover','bell','seven','cherry','lemon','clover','seven'];
[0,1,2].forEach(restStrip);setLever(0);fit();render();showMenu();
requestAnimationFrame(roomLoop);requestAnimationFrame(deskLoop);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
$('bRed').onclick=()=>gamble('r');
$('bBlack').onclick=()=>gamble('b');
$('endBtn').onclick=endDay;
$('tray').onclick=collect;
$('tray').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();collect();}});
$('door').onclick=knock;
$('door').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();knock();}});
$('bookProp').onclick=openBook;
$('bkPrev').onclick=()=>flip(-1);$('bkNext').onclick=()=>flip(1);$('bkClose').onclick=closeBook;
$('bookOv').addEventListener('click',e=>{if(e.target===$('bookOv'))closeBook();});
addEventListener('resize',()=>{if(!$('bookOv').hidden)renderBook();});
applySet();
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').textContent='Ton: '+(muted?'aus':'an');if(muted)stopHiss();else if(!hs.on)liftSound();applySet();};
document.addEventListener('keydown',e=>{
  if(!$('bookOv').hidden){
    if(e.key==='Escape'||e.key==='b'||e.key==='B')closeBook();
    else if(e.key==='ArrowRight')flip(1);else if(e.key==='ArrowLeft')flip(-1);
    return;
  }
  if(!$('menu').hidden){if(e.key==='Escape')$('mpanel').hidden=true;return;}
  if((e.key==='b'||e.key==='B')&&uiFree()){openBook();return;}
  if(e.key==='Escape'&&uiFree()){showMenu();return;}
  if(!uiFree()||e.repeat) return;
  if(e.target.closest&&e.target.closest('button,[tabindex]')&&(e.key===' '||e.key==='Enter')) return;
  if(e.code==='Space'){e.preventDefault();autoPull();}
  else if(e.key==='m'||e.key==='M'){insertCoin();}
  else if(e.key==='e'||e.key==='E'){collect();}
  else if(e.key==='r'||e.key==='R'){doShake();}
  else if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){keyDir=-1;}
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){keyDir=1;}
});
document.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key))keyDir=0;});
bindLook('lookL',-1);bindLook('lookR',1);
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
</script>
